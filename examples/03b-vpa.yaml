# Example 03b: a VerticalPodAutoscaler. It needs the VPA CRDs and controllers in the cluster
# (GKE: --enable-vertical-pod-autoscaling, on by default in Autopilot; elsewhere the
# kubernetes/autoscaler vertical-pod-autoscaler install). Without them the API server rejects
# the VerticalPodAutoscaler object; examples/README.md says so. The Deployment asks for far
# too little CPU and memory so the recommender raises it and the updater recreates the pods
# with the new requests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hungry
  labels:
    app.kubernetes.io/name: hungry
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hungry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hungry
    spec:
      containers:
        - name: spin
          image: busybox:1.37
          command: ["/bin/sh", "-c", "while true; do :; done"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: hungry
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hungry
  updatePolicy:
    updateMode: Recreate
  resourcePolicy:
    containerPolicies:
      - containerName: spin
        maxAllowed:
          cpu: 500m
          memory: 256Mi
