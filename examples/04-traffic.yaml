# Example 04: three-tier service traffic and NetworkPolicy drops (web -> api -> cache).
# web calls api (allowed) and cache directly (blocked by cache-only-from-api); api calls cache
# (allowed). On a cluster with Hubble Relay (Cilium or GKE Dataplane V2), visual-kubernetes
# draws blue particles on web -> api and api -> cache and red policy-drop particles on
# web -> cache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  labels:
    app.kubernetes.io/name: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  labels:
    app.kubernetes.io/name: cache
spec:
  selector:
    app.kubernetes.io/name: cache
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: upstream
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - while sleep 0.5; do wget -q -T 2 -O- http://cache >/dev/null 2>&1 || true; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: client
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              while sleep 0.5; do
                wget -q -T 2 -O- http://api >/dev/null 2>&1 || true
                wget -q -T 1 -O- http://cache >/dev/null 2>&1 || true
              done
          resources:
            requests:
              cpu: 15m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cache-only-from-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cache
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - protocol: TCP
          port: 80
