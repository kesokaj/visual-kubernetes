# visual-kubernetes: opt-in Google Identity-Aware Proxy (IAP) interactive demo variant for
# NON-PRODUCTION teaching clusters ONLY (PRD R1, R6, R7, S1; ADR-010, ADR-011, ADR-013).
#
# WARNING: DO NOT apply this manifest to production clusters. For production or read-only
# inspection, apply deploy/install.yaml instead.
#
# REQUIRED edits before applying on GKE:
#   1. Replace 000000000000 and 0000000000000000 in --iap-audience with your numeric GCP Project
#      Number and BackendService ID (/projects/<PROJECT_NUMBER>/global/backendServices/<BACKEND_ID>).
#      The placeholder fails closed (401 on every request until replaced).
#   2. Replace visual-kubernetes.example.internal in --allowed-host with your HTTPS Load Balancer
#      DNS hostname (for example demo.example.com).
#   3. Attach a GKE ManagedCertificate, BackendConfig (spec.iap.enabled: true + oauthclientCredentials
#      secretName), and GKE External Application Load Balancer Ingress routing that hostname to
#      svc/visual-kubernetes:80.
#   4. NOTE: Switching a workload Service to `LoadBalancer` from the `--demo` panel on GKE provisions
#      an external `0.0.0.0/0` cloud Network Load Balancer (bypassing IAP on that workload Service)
#      unless constrained by a cluster ValidatingAdmissionPolicy or VPC firewall; grant IAP access
#      only to trusted presenters on isolated non-production demo clusters.
#
# Uninstall cleanly with:
#   kubectl delete --ignore-not-found -f deploy/install-iap.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: visual-kubernetes
  labels:
    app.kubernetes.io/name: visual-kubernetes
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: visual-kubernetes
  namespace: visual-kubernetes
  labels:
    app.kubernetes.io/name: visual-kubernetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: visual-kubernetes
  labels:
    app.kubernetes.io/name: visual-kubernetes
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/stats, pods/log]
    verbs: [get]
  - apiGroups: [""]
    # PRD R2's one named exception: the mTLS client cert for GKE Dataplane V2's Hubble Relay.
    resources: [secrets]
    resourceNames: [hubble-relay-client-certs]
    verbs: [get]
  - apiGroups: [apps]
    resources: [controllerrevisions, daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling.k8s.io]
    resources: [verticalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses, ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, grpcroutes, httproutes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [csidrivers, csinodes, storageclasses, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /readyz]
    verbs: [get]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, statefulsets]
    verbs: [patch, update]
  - apiGroups: [""]
    resources: [services]
    verbs: [patch, update]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [patch, update]
  - apiGroups: [autoscaling.k8s.io]
    resources: [verticalpodautoscalers]
    verbs: [patch, update]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: visual-kubernetes
  labels:
    app.kubernetes.io/name: visual-kubernetes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: visual-kubernetes
subjects:
  - kind: ServiceAccount
    name: visual-kubernetes
    namespace: visual-kubernetes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visual-kubernetes
  namespace: visual-kubernetes
  labels:
    app.kubernetes.io/name: visual-kubernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: visual-kubernetes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: visual-kubernetes
    spec:
      serviceAccountName: visual-kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: visual-kubernetes
          image: europe-north1-docker.pkg.dev/exact-loon-6dim/visual-kubernetes/visual-kubernetes:v0.2.0
          imagePullPolicy: IfNotPresent
          args:
            - --demo
            - --iap-audience=/projects/000000000000/global/backendServices/0000000000000000
            - --allowed-host=visual-kubernetes.example.internal
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: visual-kubernetes
  namespace: visual-kubernetes
  labels:
    app.kubernetes.io/name: visual-kubernetes
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: visual-kubernetes
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: visual-kubernetes-iap-ingress
  namespace: visual-kubernetes
  labels:
    app.kubernetes.io/name: visual-kubernetes
spec:
  podSelector: {}
  policyTypes: [Ingress]
  # Google Cloud HTTP(S) Load Balancer & IAP proxy ranges only; pod-to-pod cluster CIDRs are denied.
  ingress:
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - protocol: TCP
          port: http
