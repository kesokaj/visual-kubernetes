# visual-kubernetes: opt-in interactive demo variant for NON-PRODUCTION teaching clusters ONLY
# (PRD R1, R6, R7, S1; ADR-010, ADR-011).
#
# WARNING: DO NOT apply this manifest to production clusters. For production or read-only
# inspection, apply deploy/install.yaml instead.
#
#   kubectl apply -f https://github.com/kesokaj/visual-kubernetes/releases/download/v0.1.0/install-demo.yaml
#   kubectl -n visual-kubernetes port-forward svc/visual-kubernetes 8080:80
#   open http://localhost:8080
#
# This variant passes `--demo` and grants ONLY two additional narrow rules beyond install.yaml:
#   - apps [daemonsets, deployments, statefulsets] [patch, update] (plain container env editor)
#   - "" [pods/exec] [create, get] (interactive pod shell)
# Secrets remain locked (R2), system namespaces (`kube-system`, `kube-public`, `kube-node-lease`,
# `visual-kubernetes`, `gke-managed-*`, `gmp-*`) are refused with 403, the Service stays ClusterIP
# behind a deny-all-ingress NetworkPolicy, and `--demo` without `--iap-audience` refuses non-loopback
# Host headers (`localhost`, `127.0.0.1`, `::1` via `kubectl port-forward`).
apiVersion: v1
kind: Namespace
metadata:
  name: visual-kubernetes
  labels:
    app.kubernetes.io/name: visual-kubernetes
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: visual-kubernetes
  namespace: visual-kubernetes
  labels:
    app.kubernetes.io/name: visual-kubernetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: visual-kubernetes
  labels:
    app.kubernetes.io/name: visual-kubernetes
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/stats, pods/log]
    verbs: [get]
  - apiGroups: [""]
    # PRD R2's one named exception: the mTLS client cert for GKE Dataplane V2's Hubble Relay.
    resources: [secrets]
    resourceNames: [hubble-relay-client-certs]
    verbs: [get]
  - apiGroups: [apps]
    resources: [controllerrevisions, daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling.k8s.io]
    resources: [verticalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses, ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, grpcroutes, httproutes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [csidrivers, csinodes, storageclasses, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /readyz]
    verbs: [get]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, statefulsets]
    verbs: [patch, update]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: visual-kubernetes
  labels:
    app.kubernetes.io/name: visual-kubernetes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: visual-kubernetes
subjects:
  - kind: ServiceAccount
    name: visual-kubernetes
    namespace: visual-kubernetes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visual-kubernetes
  namespace: visual-kubernetes
  labels:
    app.kubernetes.io/name: visual-kubernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: visual-kubernetes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: visual-kubernetes
    spec:
      serviceAccountName: visual-kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: visual-kubernetes
          image: europe-north1-docker.pkg.dev/exact-loon-6dim/visual-kubernetes/visual-kubernetes:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --demo
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: visual-kubernetes
  namespace: visual-kubernetes
  labels:
    app.kubernetes.io/name: visual-kubernetes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: visual-kubernetes
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: visual-kubernetes-deny-ingress
  namespace: visual-kubernetes
  labels:
    app.kubernetes.io/name: visual-kubernetes
spec:
  podSelector: {}
  policyTypes: [Ingress]
