/* visual-kubernetes mockup v2 · simulated data only (no network, no cluster).
   One white page: every object is an official Kubernetes icon; pods hang around their owner. */

const P = new URLSearchParams(location.search);
const pNum = (k, d) => (P.has(k) && isFinite(+P.get(k)) ? +P.get(k) : d);
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = (s) => document.querySelector(s);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, f) => a + (b - a) * f;
const approach = (rate, dt) => 1 - Math.exp(-rate * dt);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Deterministic PRNG so every run, and every screenshot, is identical.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function next() {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rand = mulberry32(11);
function rid(n) {
  const cs = 'bcdfghjklmnpqrstvwxz2456789';
  let s = '';
  for (let i = 0; i < n; i++) s += cs[Math.floor(rand() * cs.length)];
  return s;
}

function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function icon(name, size, parent) {
  return el('use', { href: '#k-' + name, class: 'ic', x: -size / 2, y: -size / 2, width: size, height: size }, parent);
}
function globe(size, parent) {
  const g = el('g', { class: 'ic' }, parent);
  const r = size / 2;
  el('circle', { r, fill: '#fff', stroke: '#326ce5', 'stroke-width': 2 }, g);
  el('ellipse', { rx: r * 0.45, ry: r, fill: 'none', stroke: '#326ce5', 'stroke-width': 1.5 }, g);
  el('path', { d: `M${-r} 0H${r}M${-r * 0.85} ${-r * 0.5}H${r * 0.85}M${-r * 0.85} ${r * 0.5}H${r * 0.85}`, stroke: '#326ce5', 'stroke-width': 1.2 }, g);
  return g;
}
function setT(node, x, y, s) {
  node.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})` + (s && s !== 1 ? ` scale(${s.toFixed(3)})` : ''));
}
function cores(m) { return (m / 1000).toFixed(2); }
function mib(v) { return v >= 1024 ? (v / 1024).toFixed(1) + ' GiB' : Math.round(v) + ' MiB'; }
function rate(v) { return v >= 100 ? Math.round(v) + ' req/s' : v.toFixed(1) + ' req/s'; }
function ago(sec) { return sec < 60 ? Math.floor(sec) + 's' : Math.floor(sec / 60) + 'm' + String(Math.floor(sec % 60)).padStart(2, '0') + 's'; }
function clock(t) {
  const base = 14 * 3600 + 32 * 60; // simulated wall clock starts at 14:32:00
  const s = Math.floor(base + t);
  return [s / 3600, (s / 60) % 60, s % 60].map((v) => String(Math.floor(v)).padStart(2, '0')).join(':');
}
// Cluster model: apps (workload + Service), pods, worker nodes, control-plane parts and edges.
// World space is ~1920×1080 and laid out with generous gaps; the camera fits it to the window.
const S = {
  t: 0, speed: clamp(pNum('speed', 1), 0.25, 8), paused: false,
  apps: new Map(), pods: new Map(), nodes: new Map(), ents: new Map(), edges: [], events: [],
  sel: null, podSeq: 0, ipSeq: 20, nodeSeq: 0,
};
// Seed positions only: the spider-web layout (14b-layout.js) takes over from the first frame.
const BAND = { cp: 95, nodes: 330, appsTop: 480 };
const NODE_COLORS = ['#0d9488', '#7c3aed', '#ea580c', '#db2777', '#2563eb', '#65a30d', '#0891b2', '#9333ea', '#c2410c', '#be185d'];
// Node row: centred between the control-plane band edges, re-spaced on join/leave, wraps after 10.
function layoutNodes(snap) {
  const ns = liveNodes();
  const perRow = 10;
  ns.forEach((n, i) => {
    const row = Math.floor(i / perRow), inRow = Math.min(perRow, ns.length - row * perRow);
    const dx = Math.min(240, 1100 / Math.max(1, inRow - 1));
    n.tx = 860 - (dx * (inRow - 1)) / 2 + (i % perRow) * dx;
    n.ty = BAND.nodes + row * 110 - (ns.length > perRow ? 45 : 0);
    if (snap && n.phase !== 'Provisioning') { n.x = n.tx; n.y = n.ty; }
  });
}
const ZONES = ['europe-north1-a', 'europe-north1-b', 'europe-north1-c'];

function addEnt(id, o) {
  const e = Object.assign({ id, type: 'cp', rps: 0, hist: { rps: [] }, sub: '' }, o);
  S.ents.set(id, e);
  return e;
}

function addApp(id, o) {
  const a = Object.assign({
    id, name: id, ns: 'shop', kind: 'deploy', sys: false, replicas: 1, cpu: 150, mem: 128, baseRps: 0, load: 1,
    rps: 0, sats: [], rev: 1, rs: rid(9), image: 'us-docker.pkg.dev/google-samples/microservices-demo/' + id + ':v0.10.2',
    port: 8080, hist: { rps: [], cpu: [], mem: [], replicas: [] }, born: 0, x: 0, y: 0, ox: 0, oy: 0,
  }, o);
  a.ox = a.x; a.oy = a.y;
  S.apps.set(id, a);
  return a;
}

function addNode(name, ready) {
  const i = S.nodes.size;
  const n = {
    id: name, name: 'gke-demo-default-pool-' + name, short: name, zone: ZONES[i % 3], type: 'e2-standard-4',
    x: 900, y: BAND.nodes, tx: 900, ty: BAND.nodes, color: NODE_COLORS[S.nodeSeq++ % NODE_COLORS.length], phase: ready ? 'Ready' : 'Provisioning', since: S.t,
    cpuAlloc: 3920, memAlloc: 13000, hist: { cpu: [], mem: [] }, gone: false,
  };
  S.nodes.set(name, n);
  layoutNodes(ready);
  // A joining node appears next to the API server and is pulled into the web by its springs.
  if (!ready) { const api = S.ents.get('api'); n.x = api.x + 60 + rand() * 80; n.y = api.y + 90; }
  return n;
}
// Satellite (Service, HPA, ConfigMap…) offset grows with the owner's icon so it never overlaps it.
function satPos(a, s) {
  const f = a.size ? a.size / 52 + 0.15 : 1;
  return { x: a.x + s.dx * f, y: a.y + s.dy * f };
}

function seedControlPlane() {
  addEnt('api', { name: 'kube-apiserver', icon: 'api', x: 540, y: BAND.cp, sub: 'API · managed' });
  addEnt('etcd', { name: 'etcd', icon: 'etcd', x: 220, y: BAND.cp, sub: 'cluster store' });
  addEnt('sched', { name: 'kube-scheduler', icon: 'sched', x: 860, y: BAND.cp, sub: 'places pods' });
  addEnt('cm', { name: 'kube-controller-manager', icon: 'c-m', x: 1180, y: BAND.cp, sub: 'runs controllers' });
  addEnt('ca', { name: 'cluster-autoscaler', icon: 'c-m', x: 1500, y: BAND.cp, sub: 'adds / removes nodes' });
  addEnt('internet', { type: 'ext', name: 'internet', icon: 'globe', x: 110, y: 660, sub: 'clients' });
  addEnt('ing', { type: 'ext', name: 'shop-ingress', icon: 'ing', x: 280, y: 660, sub: 'Ingress · 34.88.12.7', kind: 'Ingress' });
}

function seedApps() {
  const svc = (dx = -64, dy = -38) => ({ kind: 'svc', dx, dy });
  addApp('frontend', { x: 560, y: 720, replicas: 3, cpu: 120, mem: 96, baseRps: 310, sats: [svc(), { kind: 'cm', dx: 66, dy: -34 }], port: 8080 });
  addApp('productcatalog', { x: 880, y: 580, replicas: 2, cpu: 100, mem: 128, baseRps: 150, sats: [svc(), { kind: 'cm', dx: 66, dy: -34 }], port: 3550 });
  addApp('cart', { x: 900, y: 910, replicas: 2, cpu: 200, mem: 128, baseRps: 170, sats: [svc(), { kind: 'hpa', dx: 66, dy: -36 }], port: 7070, hpa: { min: 2, max: 6, target: 60 } });
  addApp('redis-cart', { x: 1200, y: 960, kind: 'sts', replicas: 1, cpu: 70, mem: 256, baseRps: 120, sats: [svc(), { kind: 'pvc', dx: 64, dy: -36 }], port: 6379, image: 'redis:7.4-alpine' });
  addApp('checkout', { x: 1180, y: 690, replicas: 2, cpu: 100, mem: 128, baseRps: 36, sats: [svc(), { kind: 'netpol', dx: 66, dy: -36, off: true }], port: 5050 });
  addApp('payment', { x: 1440, y: 780, replicas: 1, cpu: 100, mem: 64, baseRps: 30, sats: [svc()], port: 50051 });
  addApp('loadgenerator', { x: 330, y: 950, replicas: 1, cpu: 300, mem: 256, baseRps: 60, sats: [] });
  seedSystemApps();
}

function seedSystemApps() {
  const o = { ns: 'kube-system', sys: true };
  addApp('kube-dns', Object.assign({ x: 1640, y: 600, replicas: 2, cpu: 100, mem: 70, baseRps: 46, sats: [{ kind: 'svc', dx: -60, dy: -34 }], image: 'gke.gcr.io/coredns:1.12' }, o));
  addApp('metrics-server', Object.assign({ x: 1900, y: 600, replicas: 1, cpu: 50, mem: 64, baseRps: 6, image: 'gke.gcr.io/metrics-server:v0.8' }, o));
  addApp('hubble-relay', Object.assign({ x: 1640, y: 860, replicas: 1, cpu: 50, mem: 64, baseRps: 12, ns: 'gke-managed-dpv2-observability', image: 'gke.gcr.io/hubble-relay:v1.17' }, o));
  addApp('visual-kubernetes', Object.assign({ x: 1900, y: 860, replicas: 1, cpu: 50, mem: 64, baseRps: 16, ns: 'visual-kubernetes', image: 'europe-north1-docker.pkg.dev/exact-loon-6dim/visual-kubernetes/vk:v0.1.0' }, o));
  addApp('anetd', Object.assign({ x: 1640, y: BAND.nodes, kind: 'ds', cpu: 80, mem: 160, baseRps: 0, image: 'gke.gcr.io/cilium/cilium:v1.17' }, o));
  addApp('fluentbit-gke', Object.assign({ x: 1900, y: BAND.nodes, kind: 'ds', cpu: 60, mem: 100, baseRps: 0, image: 'gke.gcr.io/fluent-bit:v3.2' }, o));
}

function seedEdges() {
  const e = (from, to, w) => S.edges.push({ from, to, w, deny: false });
  e('internet', 'ing', 0.8); e('ing', 'frontend', 0.8); e('loadgenerator', 'frontend', 0.5);
  e('frontend', 'productcatalog', 0.6); e('frontend', 'cart', 0.55); e('frontend', 'checkout', 0.2);
  e('cart', 'redis-cart', 0.5); e('checkout', 'payment', 0.3); e('checkout', 'cart', 0.2);
  e('checkout', 'productcatalog', 0.15); e('visual-kubernetes', 'hubble-relay', 0.2);
}

function resetWorld() {
  rand = mulberry32(11);
  for (const k of ['apps', 'pods', 'nodes', 'ents']) S[k].clear();
  Object.assign(S, { t: 0, edges: [], events: [], podSeq: 0, ipSeq: 20, nodeSeq: 0 });
  seedControlPlane();
  seedApps();
  seedEdges();
  ['a7f3', 'b2c9', 'c5d1'].forEach((n) => addNode(n, true));
  for (const a of S.apps.values()) reconcile(a, true);
}

function appPods(a, live) {
  const out = [];
  for (const p of S.pods.values()) if (p.app === a.id && (!live || p.phase !== 'Terminating')) out.push(p);
  return out;
}
function nodePods(n) {
  const out = [];
  for (const p of S.pods.values()) if (p.node === n.id && p.phase !== 'Terminating') out.push(p);
  return out;
}
function liveNodes() { return [...S.nodes.values()].filter((n) => !n.gone); }
function readyNodes() { return liveNodes().filter((n) => n.phase === 'Ready'); }
function entityPos(id) { return S.apps.get(id) || S.ents.get(id) || S.nodes.get(id); }
// Lifecycle: controllers reconcile replicas, the scheduler binds pods, kubelets start them, nodes join and drain.
// Timings are teaching-speed (seconds), not real cluster latencies.
const T_PENDING = 0.9;
const T_CREATE = 1.8;
const T_TERM = 1.4;
const T_RETRY = 1.6;

function addEvent(obj, reason, msg, type) {
  S.events.push({ t: S.t, obj, reason, msg, type: type || 'Normal' });
  if (S.events.length > 400) S.events.splice(0, 100);
}

function livePods(a) {
  return appPods(a, true).filter((p) => p.phase !== 'Completed');
}

function reconcile(a, instant) {
  if (a.kind === 'ds') return reconcileDs(a, instant);
  if (a.done || a.rolling) return; // finished Job, or a rollout that manages its own surge
  const pods = livePods(a);
  for (let i = pods.length; i < a.replicas; i++) createPod(a, instant, null);
  if (pods.length > a.replicas) {
    const order = { Unschedulable: 0, Pending: 1, Creating: 2, CrashLoop: 3, Running: 4 };
    pods.sort((p, q) => order[p.phase] - order[q.phase] || q.born - p.born);
    pods.slice(0, pods.length - a.replicas).forEach((p) => terminatePod(p, 'scale down'));
  }
}

function reconcileDs(a, instant) {
  const pods = livePods(a);
  for (const n of liveNodes()) {
    if (n.phase === 'Provisioning' || n.phase === 'Draining') continue;
    if (!pods.some((p) => p.pin === n.id)) createPod(a, instant, n.id);
  }
  for (const p of pods) if (!S.nodes.get(p.pin) || S.nodes.get(p.pin).gone) terminatePod(p, 'node removed');
}

function createPod(a, instant, pin) {
  const id = 'p' + ++S.podSeq;
  const ang = rand() * Math.PI * 2;
  const r = instant ? ringRadius(a) + rand() * 26 : 6;
  const p = {
    id, app: a.id, rs: a.rs, name: a.id + '-' + (a.kind === 'sts' ? livePods(a).length : a.rs.slice(0, 5) + '-' + rid(5)),
    phase: 'Pending', node: null, pin, since: S.t, born: S.t, restarts: 0, ip: '', cpu: 0, mem: 0,
    x: a.x + Math.cos(ang) * r, y: a.y + Math.sin(ang) * r, vx: 0, vy: 0, hist: { cpu: [], mem: [] }, logs: [],
  };
  S.pods.set(id, p);
  if (instant) {
    const n = pin ? S.nodes.get(pin) : pickNode(a);
    Object.assign(p, { node: n ? n.id : null, phase: n ? 'Running' : 'Unschedulable', ip: nextIp() });
  } else {
    addEvent('Pod/' + p.name, 'SuccessfulCreate', `ReplicaSet ${a.id}-${a.rs.slice(0, 5)} created pod`);
  }
  return p;
}

function nextIp() { S.ipSeq += 1; return '10.52.' + Math.floor(S.ipSeq / 200) + '.' + (S.ipSeq % 200 + 10); }

function terminatePod(p, why) {
  if (p.phase === 'Terminating') return;
  p.phase = 'Terminating';
  p.since = S.t;
  addEvent('Pod/' + p.name, 'Killing', 'Stopping container (' + why + ')');
}

function nodeUsed(n) {
  let cpu = 0, mem = 0;
  for (const p of nodePods(n)) { const a = S.apps.get(p.app); cpu += a.cpu; mem += a.mem; }
  return { cpu, mem };
}

function pickNode(a) {
  let best = null, bestFree = -1;
  for (const n of readyNodes()) {
    const free = n.cpuAlloc - nodeUsed(n).cpu;
    if (free >= a.cpu && free > bestFree) { best = n; bestFree = free; }
  }
  return best;
}

function stepPod(p, dt) {
  const age = S.t - p.since;
  const a = S.apps.get(p.app);
  if (p.phase === 'Pending' && age > T_PENDING) schedule(p, a);
  else if (p.phase === 'Unschedulable' && age > T_RETRY) schedule(p, a);
  else if (p.phase === 'Creating' && age > T_CREATE) startPod(p, a);
  else if (p.phase === 'CrashLoop' && age > 3.2) startPod(p, a);
  else if (p.phase === 'Terminating' && age > T_TERM) S.pods.delete(p.id);
}

function schedule(p, a) {
  const n = p.pin ? S.nodes.get(p.pin) : pickNode(a);
  p.since = S.t;
  if (p.pin && n && !n.gone && n.phase !== 'Ready') return; // DaemonSet pod waits for its own node
  if (!n || n.phase !== 'Ready') {
    if (p.phase !== 'Unschedulable') {
      addEvent('Pod/' + p.name, 'FailedScheduling', `0/${liveNodes().length} nodes are available: Insufficient cpu`, 'Warning');
      fxToast(p, 'scheduler', 'no node fits · Pending', true);
    }
    p.phase = 'Unschedulable';
    return;
  }
  p.node = n.id;
  p.phase = 'Creating';
  addEvent('Pod/' + p.name, 'Scheduled', 'Successfully assigned ' + a.ns + '/' + p.name + ' to ' + n.name);
  fxSchedule(p, n);
}

function startPod(p, a) {
  if (p.phase === 'CrashLoop') p.restarts += 1;
  p.phase = 'Running';
  p.since = S.t;
  if (!p.ip) p.ip = nextIp();
  addEvent('Pod/' + p.name, 'Started', 'Started container ' + a.id);
}

function stepNode(n) {
  const age = S.t - n.since;
  if (n.phase === 'Provisioning' && age > 3) setNodePhase(n, 'NotReady');
  else if (n.phase === 'NotReady' && age > 3) setNodePhase(n, 'Ready');
  else if (n.phase === 'Draining' && age > 1 && !nodePods(n).length) { n.gone = true; S.nodes.delete(n.id); fxToast(n, 'node', n.short + ' removed'); }
}

function setNodePhase(n, phase) {
  n.phase = phase;
  n.since = S.t;
  addEvent('Node/' + n.name, phase === 'Ready' ? 'NodeReady' : 'RegisteredNode', 'Node ' + n.name + ' status is now: ' + phase);
  fxToast(n, 'node', n.short + ' ' + (phase === 'Ready' ? 'Ready' : 'registered · NotReady'));
}

function drainNode(n) {
  n.phase = 'Draining';
  n.since = S.t;
  addEvent('Node/' + n.name, 'ScaleDown', 'marked the node as toBeDeleted/unschedulable');
  for (const p of nodePods(n)) terminatePod(p, 'drain');
}

function stepLife(dt) {
  for (const p of [...S.pods.values()]) stepPod(p, dt);
  for (const n of [...S.nodes.values()]) stepNode(n);
  for (const a of S.apps.values()) reconcile(a, false);
}
// Simulated metrics: request rate per app (Hubble-style), pod CPU/memory, node usage, HPA control loop.
const M = { acc: 0, hpaAcc: 0, maxRps: 1 };

function initCaps() {
  for (const a of S.apps.values()) {
    a.cap = a.baseRps > 0 ? a.baseRps / Math.max(1, a.replicas) / 0.45 : 0;
    a.lowSince = null;
  }
}

function running(a) { return appPods(a, true).filter((p) => p.phase === 'Running'); }

function stepMetrics(dt) {
  const k = approach(1.6, dt);
  for (const a of S.apps.values()) {
    const run = running(a).length;
    const wob = 1 + 0.07 * Math.sin(S.t * 0.7 + a.x * 0.01) + 0.04 * Math.sin(S.t * 2.3 + a.y);
    const target = run ? a.baseRps * a.load * wob : 0;
    a.rps = lerp(a.rps, target, k);
    a.util = a.cap ? a.rps / Math.max(1, run) / a.cap : 0.3;
  }
  const ing = S.ents.get('ing'), fe = S.apps.get('frontend');
  ing.rps = fe.rps * 0.8;
  S.ents.get('internet').rps = ing.rps;
  S.ents.get('api').rps = 34 + S.events.filter((e) => S.t - e.t < 5).length * 2.5;
  for (const p of S.pods.values()) stepPodUsage(p, dt);
  rankApps();
  M.acc += dt; M.hpaAcc += dt;
  if (M.acc >= 1) { M.acc = 0; sampleHistory(); }
  if (M.hpaAcc >= 3) { M.hpaAcc = 0; hpaLoop(); }
}

function stepPodUsage(p, dt) {
  const a = S.apps.get(p.app);
  const on = p.phase === 'Running';
  const jitter = 0.9 + 0.2 * Math.sin(S.t * 1.3 + p.born * 7);
  const cpu = on ? a.cpu * clamp(a.util, 0.05, 1.8) * jitter : 0;
  const mem = on ? a.mem * (0.55 + 0.25 * clamp(a.util, 0, 1.5)) : 0;
  const k = approach(1.2, dt);
  p.cpu = lerp(p.cpu, cpu, k);
  p.mem = lerp(p.mem, mem, k);
}

function rankApps() {
  const apps = [...S.apps.values()].filter((a) => !a.sys);
  M.maxRps = Math.max(1, ...apps.map((a) => a.rps));
  const top = apps.slice().sort((p, q) => q.rps - p.rps).slice(0, 3).map((a) => a.id);
  for (const a of S.apps.values()) {
    a.top = top.includes(a.id) && a.rps > 1;
    const share = a.sys ? 0 : Math.sqrt(a.rps / M.maxRps);
    a.size = lerp(a.size || 44, 42 + 34 * share, 0.08);
  }
}

function push(arr, v, n) { arr.push(v); if (arr.length > (n || 90)) arr.shift(); }

function sampleHistory() {
  for (const a of S.apps.values()) {
    const pods = running(a);
    push(a.hist.rps, a.rps);
    push(a.hist.cpu, pods.reduce((s, p) => s + p.cpu, 0));
    push(a.hist.mem, pods.reduce((s, p) => s + p.mem, 0));
    push(a.hist.replicas, livePods(a).length);
  }
  for (const p of S.pods.values()) { push(p.hist.cpu, p.cpu); push(p.hist.mem, p.mem); }
  for (const n of S.nodes.values()) {
    const pods = nodePods(n);
    push(n.hist.cpu, pods.reduce((s, p) => s + p.cpu, 0) / n.cpuAlloc * 100);
    push(n.hist.mem, pods.reduce((s, p) => s + p.mem, 0) / n.memAlloc * 100);
  }
  for (const e of S.ents.values()) push(e.hist.rps, e.rps);
}

// HorizontalPodAutoscaler: desired = ceil(current × utilization / target), scale-down after a stable window.
function hpaLoop() {
  for (const a of S.apps.values()) {
    if (!a.hpa) continue;
    const cur = Math.max(1, running(a).length);
    const util = a.util * 100;
    const desired = clamp(Math.ceil(cur * util / a.hpa.target), a.hpa.min, a.hpa.max);
    if (desired > a.replicas) { a.lowSince = null; scaleTo(a, desired, 'hpa', `CPU ${Math.round(util)}% > target ${a.hpa.target}%`); }
    else if (desired < a.replicas) {
      a.lowSince = a.lowSince ?? S.t;
      if (S.t - a.lowSince > 9) { a.lowSince = null; scaleTo(a, desired, 'hpa', `CPU ${Math.round(util)}% < target ${a.hpa.target}%`); }
    } else a.lowSince = null;
  }
}

function scaleTo(a, n, who, why) {
  const from = a.replicas;
  if (n === from) return;
  a.replicas = n;
  const kind = { deploy: 'Deployment', sts: 'StatefulSet', job: 'Job' }[a.kind] || 'Deployment';
  addEvent(kind + '/' + a.id, who === 'hpa' ? 'SuccessfulRescale' : 'ScalingReplicaSet', `Scaled ${from} → ${n}` + (why ? ' · ' + why : ''));
  fxToast(a, who === 'hpa' ? 'HPA' : kind, `${a.id} ${from} → ${n} replicas` + (why ? ' · ' + why : ''));
  fxApiCall(who === 'hpa' ? 'cm' : 'kubectl', a);
}

function edgeRate(e) {
  const to = entityPos(e.to);
  return (to && to.rps ? to.rps : 0) * e.w;
}
// Physics: anchors move with the spider-web layout (14b-layout.js); pods hang around their owner
// on a soft ring that grows with the replica count.
const POD = 24;

function ringRadius(a) { return (a.size || 44) / 2 + 48; }

function stepPhysics(dt) {
  const h = Math.min(dt, 1 / 30);
  stepLayout(h);
  const byApp = new Map();
  for (const p of S.pods.values()) {
    if (!byApp.has(p.app)) byApp.set(p.app, []);
    byApp.get(p.app).push(p);
  }
  const obstacles = obstacleList();
  for (const [id, pods] of byApp) stepCluster(S.apps.get(id), pods, obstacles, h);
}

function obstacleList() {
  const out = [];
  for (const a of S.apps.values()) {
    if (!visApp(a)) continue;
    out.push({ x: a.x, y: a.y, r: (a.size || 44) / 2 + 14 });
    out.push(...labelBlock(a.x, a.y + (a.size || 44) / 2 + 24));
    for (const s of a.sats) if (visSat(a, s)) { const q = satPos(a, s); out.push({ x: q.x, y: q.y, r: 22 }); }
  }
  for (const e of S.ents.values()) if (visEnt(e)) out.push({ x: e.x, y: e.y, r: 36 }, ...labelBlock(e.x, e.y + 50));
  for (const n of S.nodes.values()) if (visNode(n)) out.push({ x: n.x, y: n.y, r: 40 }, ...labelBlock(n.x, n.y + 56));
  return out;
}

function stepCluster(a, pods, obstacles, h) {
  const r0 = ringRadius(a);
  const r1 = r0 + 18 + Math.sqrt(pods.length) * 10;
  for (let i = 0; i < pods.length; i++) {
    const p = pods[i];
    let fx = 0, fy = 0;
    const dx = p.x - a.x, dy = p.y - a.y, d = Math.hypot(dx, dy) || 0.01;
    const want = p.phase === 'Terminating' ? r1 + 30 : clamp(d, r0, r1);
    fx += ((want - d) * dx) / d * 6;
    fy += ((want - d) * dy) / d * 6;
    for (let j = 0; j < pods.length; j++) {
      if (i === j) continue;
      const [rx, ry] = repel(p, pods[j], POD + 8, 220);
      fx += rx; fy += ry;
    }
    for (const o of obstacles) {
      const [rx, ry] = repel(p, o, o.r + POD / 2, 320);
      fx += rx; fy += ry;
    }
    fx += Math.sin(S.t * 1.7 + p.born * 13) * 6;
    fy += Math.cos(S.t * 1.3 + p.born * 11) * 6;
    p.vx = (p.vx + fx * h) * 0.86;
    p.vy = (p.vy + fy * h) * 0.86;
    p.x += p.vx * h * 4;
    p.y += p.vy * h * 4;
  }
}

function repel(p, o, min, k) {
  const dx = p.x - o.x, dy = p.y - o.y;
  const d2 = dx * dx + dy * dy;
  if (d2 >= min * min || d2 === 0) return [d2 === 0 ? 1 : 0, 0];
  const d = Math.sqrt(d2), f = ((min - d) / min) * k;
  return [(dx / d) * f, (dy / d) * f];
}

// A label is ~2 lines × ~160px; three overlapping discs keep pods off the text.
function labelBlock(x, y) {
  const r = 20 * V.inv;
  return [{ x: x - 50 * V.inv, y, r }, { x, y, r }, { x: x + 50 * V.inv, y, r }];
}
// Spider-web layout: every visible anchor (control-plane part, node, workload, ingress) is a body with springs.
// Springs follow real relations — API server ↔ control plane and nodes, traffic between workloads, and
// node ↔ workload for every pod placement — so the web reshapes itself as pods are scheduled and nodes come and go.
const WEB = { cx: 960, cy: 540 };

function anchors() {
  const out = [];
  for (const e of S.ents.values()) if (visEnt(e)) out.push(e);
  for (const n of S.nodes.values()) if (visNode(n)) out.push(n);
  for (const a of S.apps.values()) if (visApp(a)) out.push(a);
  return out;
}

function bodyRadius(o) {
  if (S.apps.has(o.id) && S.apps.get(o.id) === o) return ringRadius(o) + 26 + Math.sqrt(livePods(o).length) * 8;
  return o.type === 'ext' ? 70 : 88; // labels are ~170px wide, wider than the icon
}

function springs() {
  const out = [];
  const add = (a, b, len, k) => { if (a && b) out.push({ a, b, len, k }); };
  const api = visEnt(S.ents.get('api')) ? S.ents.get('api') : null;
  for (const id of ['etcd', 'sched', 'cm', 'ca']) if (visEnt(S.ents.get(id))) add(api, S.ents.get(id), 190, 1.2);
  for (const n of S.nodes.values()) if (visNode(n)) add(api, n, 300, 0.5);
  for (const e of S.edges) {
    const a = entityPos(e.from), b = entityPos(e.to);
    if (visAny(a) && visAny(b)) add(a, b, 290, 0.6);
  }
  for (const [key, count] of placements()) {
    const [nid, aid] = key.split('>');
    const n = S.nodes.get(nid), a = S.apps.get(aid);
    if (visNode(n) && visApp(a)) add(n, a, 360, 0.06 + 0.03 * Math.min(count, 4));
  }
  return out;
}

// "node>app" → number of live pods of that app on that node; also drawn as faint node-coloured threads.
function placements() {
  const m = new Map();
  for (const p of S.pods.values()) {
    if (!p.node || p.phase === 'Terminating' || p.phase === 'Completed') continue;
    const key = p.node + '>' + p.app;
    m.set(key, (m.get(key) || 0) + 1);
  }
  return m;
}

function stepLayout(dt) {
  const h = Math.min(dt, 1 / 30);
  const bodies = anchors();
  for (const o of bodies) { o.fx = (WEB.cx - o.x) * 0.16; o.fy = (WEB.cy - o.y) * 0.16; o.br = bodyRadius(o); }
  for (let i = 0; i < bodies.length; i++) {
    for (let j = i + 1; j < bodies.length; j++) pushApart(bodies[i], bodies[j]);
  }
  for (const s of springs()) pull(s);
  for (const o of bodies) {
    o.lvx = ((o.lvx || 0) + o.fx * h) * 0.82;
    o.lvy = ((o.lvy || 0) + o.fy * h) * 0.82;
    const v = Math.hypot(o.lvx, o.lvy), max = 260;
    if (v > max) { o.lvx *= max / v; o.lvy *= max / v; }
    o.x += o.lvx * h;
    o.y += o.lvy * h;
  }
}

function pushApart(a, b) {
  let dx = b.x - a.x, dy = b.y - a.y;
  let d = Math.hypot(dx, dy);
  if (d < 0.01) { dx = 1; dy = 0.5; d = 1.1; }
  const min = a.br + b.br + 110;
  const f = d < min ? (min - d) * 9 : 9000 / (d * d) * 40;
  a.fx -= (dx / d) * f; a.fy -= (dy / d) * f;
  b.fx += (dx / d) * f; b.fy += (dy / d) * f;
}

function pull(s) {
  const dx = s.b.x - s.a.x, dy = s.b.y - s.a.y, d = Math.hypot(dx, dy) || 0.01;
  const f = (d - s.len) * s.k;
  s.a.fx += (dx / d) * f; s.a.fy += (dy / d) * f;
  s.b.fx -= (dx / d) * f; s.b.fy -= (dy / d) * f;
}

// Settle the web before the first frame so the page opens calm, not exploding from the seed positions.
function settleLayout(steps) {
  for (let i = 0; i < steps; i++) stepLayout(1 / 30);
  for (const o of anchors()) { o.lvx = 0; o.lvy = 0; }
}
// Camera: auto-fits the whole cluster to the window (minus the panel when open); drag pans, wheel zooms, F re-fits.
const V = { k: 1, tx: 0, ty: 0, inv: 1, auto: true, w: innerWidth, h: innerHeight, drag: null };

function contentBox() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y, r) => { x0 = Math.min(x0, x - r); y0 = Math.min(y0, y - r); x1 = Math.max(x1, x + r); y1 = Math.max(y1, y + r); };
  for (const e of S.ents.values()) if (visEnt(e)) add(e.x, e.y, 70);
  for (const n of S.nodes.values()) if (visNode(n)) add(n.x, n.y, 80);
  for (const a of S.apps.values()) if (visApp(a)) add(a.x, a.y, ringRadius(a) + 40);
  for (const p of S.pods.values()) if (visPod(p)) add(p.x, p.y, 20);
  if (x0 === Infinity) return { x0: 0, y0: 0, x1: 1920, y1: 1080 };
  return { x0, y0: y0 - 10, x1, y1: y1 + 30 };
}

function fitTarget() {
  const b = contentBox();
  const pad = 36;
  const w = V.w - (S.sel ? 470 : 0);
  const k = Math.min((w - pad * 2) / (b.x1 - b.x0), (V.h - pad * 2) / (b.y1 - b.y0));
  return { k, tx: (w - (b.x1 - b.x0) * k) / 2 - b.x0 * k, ty: (V.h - (b.y1 - b.y0) * k) / 2 - b.y0 * k };
}

function stepView(dt, instant) {
  if (V.auto) {
    const f = fitTarget();
    const q = instant ? 1 : approach(2.2, dt);
    V.k = lerp(V.k, f.k, q); V.tx = lerp(V.tx, f.tx, q); V.ty = lerp(V.ty, f.ty, q);
  }
  V.inv = 1 / V.k;
  $('#world').setAttribute('transform', `translate(${V.tx.toFixed(1)},${V.ty.toFixed(1)}) scale(${V.k.toFixed(4)})`);
}

function toWorld(sx, sy) { return { x: (sx - V.tx) / V.k, y: (sy - V.ty) / V.k }; }

function wireView() {
  const svg = $('#svg');
  addEventListener('resize', () => { V.w = innerWidth; V.h = innerHeight; sizeCanvas(); });
  svg.addEventListener('pointerdown', (ev) => {
    V.drag = { x: ev.clientX, y: ev.clientY, tx: V.tx, ty: V.ty, moved: false };
  });
  addEventListener('pointermove', (ev) => {
    if (!V.drag) return;
    const dx = ev.clientX - V.drag.x, dy = ev.clientY - V.drag.y;
    if (!V.drag.moved && Math.hypot(dx, dy) < 4) return;
    V.drag.moved = true; V.auto = false; svg.classList.add('drag');
    V.tx = V.drag.tx + dx; V.ty = V.drag.ty + dy;
  });
  addEventListener('pointerup', (ev) => {
    const d = V.drag;
    V.drag = null; svg.classList.remove('drag');
    if (d && !d.moved) onClick(ev);
  });
  svg.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const f = Math.exp(-ev.deltaY * 0.0015), w = toWorld(ev.clientX, ev.clientY);
    V.auto = false;
    V.k = clamp(V.k * f, 0.25, 4);
    V.tx = ev.clientX - w.x * V.k; V.ty = ev.clientY - w.y * V.k;
  }, { passive: false });
}

function onClick(ev) {
  const hit = ev.target.closest && ev.target.closest('[data-sel]');
  if (hit) select(hit.getAttribute('data-sel'));
  else select(null);
}
// SVG building: one cached group per object, keyed by "type:id"; stale groups are removed each frame.
const R = { items: new Map(), seen: new Set() };
const KIND_ICON = { deploy: 'deploy', sts: 'sts', ds: 'ds', job: 'job' };
const KIND_NAME = { deploy: 'Deployment', sts: 'StatefulSet', ds: 'DaemonSet', job: 'Job' };

function ensure(key, layer, build) {
  R.seen.add(key);
  let it = R.items.get(key);
  if (!it) {
    it = { g: el('g', { 'data-sel': key, class: 'hit' }, $(layer)) };
    build(it);
    R.items.set(key, it);
  }
  return it;
}

function sweep() {
  for (const [k, it] of R.items) {
    if (R.seen.has(k)) continue;
    it.g.remove();
    if (it.lbl) it.lbl.remove();
    if (it.tether) it.tether.remove();
    if (it.halo) it.halo.remove();
    R.items.delete(k);
  }
  R.seen.clear();
}

function makeLabel(it, cls) {
  it.lbl = el('g', { class: cls || '' }, $('#l-labels'));
  it.name = el('text', { class: 'lbl name', 'text-anchor': 'middle', y: 14 }, it.lbl);
  it.sub = el('text', { class: 'lbl sub', 'text-anchor': 'middle', y: 31 }, it.lbl);
}

function setLabel(it, x, y, name, sub) {
  setT(it.lbl, x, y, V.inv);
  if (it.lastName !== name) { it.name.textContent = name; it.lastName = name; }
  if (it.lastSub !== sub) { it.sub.textContent = sub; it.lastSub = sub; }
}

function buildEnt(e) {
  return (it) => {
    it.size = e.type === 'ext' ? 46 : 54;
    if (e.icon === 'globe') globe(it.size * 0.8, it.g);
    else icon(e.icon, it.size, it.g);
    makeLabel(it);
  };
}

function buildNode(n) {
  return (it) => {
    icon('node', 58, it.g);
    el('circle', { cx: 22, cy: -22, r: 7, fill: n.color, stroke: '#fff', 'stroke-width': 2 }, it.g);
    makeLabel(it);
    it.barBg = el('rect', { class: 'bar-bg', x: -45, y: 40, width: 90, height: 5, rx: 2.5 }, it.lbl);
    it.bar = el('rect', { class: 'bar', x: -45, y: 40, width: 0, height: 5, rx: 2.5 }, it.lbl);
  };
}

function buildApp(a) {
  return (it) => {
    it.halo = el('circle', { fill: 'url(#halo)', r: 0 }, $('#l-halos'));
    it.body = el('g', {}, it.g);
    it.ic = icon(KIND_ICON[a.kind], 44, it.body);
    it.sats = a.sats.map((s, i) => {
      const g = el('g', { 'data-sel': 'sat:' + a.id + ':' + i, class: 'hit' }, it.g);
      icon(s.kind, 28, g);
      return g;
    });
    makeLabel(it, a.sys ? 'sys' : '');
    if (a.sys) it.g.classList.add('sys');
  };
}

function buildPod(p) {
  return (it) => {
    it.tether = el('line', { class: 'tether' }, $('#l-tethers'));
    it.ring = el('circle', { r: POD * 0.62, fill: 'none', 'stroke-width': 1.6 }, it.g);
    it.hot = el('circle', { r: POD, fill: 'url(#hot)', opacity: 0 }, it.g);
    icon('pod', POD, it.g);
    it.dot = el('circle', { cx: 8.5, cy: 8.5, r: 4, stroke: '#fff', 'stroke-width': 1.5 }, it.g);
  };
}

function buildStatic() {
  const links = $('#l-links');
  R.cpLinks = ['etcd', 'sched', 'cm', 'ca'].map((id) => ({ id, path: el('path', { class: 'cp-link' }, links) }));
  R.kubeletLinks = new Map();
}
// SVG update: positions, sizes, states and labels, every frame.
function render() {
  const hl = highlightSet();
  for (const e of S.ents.values()) updateEnt(e, hl);
  for (const n of S.nodes.values()) updateNode(n, hl);
  for (const a of S.apps.values()) updateApp(a, hl);
  for (const p of S.pods.values()) updatePod(p, hl);
  updateLinks();
  updateEdges();
  sweep();
  updateSelRing();
}

// Selecting a node lights up its pods; selecting a pod lights up its node; selecting an app lights up its pods.
function highlightSet() {
  if (!S.sel) return null;
  const [type, id] = S.sel.split(':');
  const set = new Set([S.sel]);
  for (const p of S.pods.values()) {
    if ((type === 'node' && p.node === id) || (type === 'app' && p.app === id)) set.add('pod:' + p.id);
    if (type === 'pod' && p.id === id) { set.add('node:' + p.node); set.add('app:' + p.app); }
  }
  return set;
}
function dim(it, key, hl) { it.g.style.opacity = hl && !hl.has(key) ? 0.28 : ''; if (it.lbl) it.lbl.style.opacity = it.g.style.opacity; }

function updateEnt(e, hl) {
  const it = ensure('ent:' + e.id, '#l-ents', buildEnt(e));
  setT(it.g, e.x, e.y);
  const sub = e.type === 'cp' && e.id === 'api' ? rate(e.rps) + ' · API calls' : e.id === 'ing' ? rate(e.rps) : e.sub;
  setLabel(it, e.x, e.y + it.size / 2 + 2, e.name, sub);
  dim(it, 'ent:' + e.id, hl);
  showItem(it, visEnt(e));
}

function updateNode(n, hl) {
  const it = ensure('node:' + n.id, '#l-ents', buildNode(n));
  setT(it.g, n.x, n.y);
  const pods = nodePods(n).length, used = nodeUsed(n);
  const pct = Math.round((used.cpu / n.cpuAlloc) * 100);
  const state = n.phase === 'Ready' ? '' : n.phase + ' · ';
  setLabel(it, n.x, n.y + 30, 'node ' + n.short, `${state}${pods} pods · CPU req ${pct}%`);
  it.bar.setAttribute('width', (90 * Math.min(1, pct / 100)).toFixed(1));
  it.bar.setAttribute('class', pct > 85 ? 'bar hot' : 'bar');
  const op = { Provisioning: 0.3, NotReady: 0.55, Draining: 0.45 }[n.phase];
  dim(it, 'node:' + n.id, hl);
  if (op && !hl) { it.g.style.opacity = op; it.lbl.style.opacity = Math.max(op, 0.6); }
  showItem(it, visNode(n));
}

function updateApp(a, hl) {
  const it = ensure('app:' + a.id, '#l-ents', buildApp(a));
  setT(it.g, a.x, a.y);
  setT(it.body, 0, 0, a.size / 44);
  a.sats.forEach((s, i) => { const q = satPos(a, s); setT(it.sats[i], q.x - a.x, q.y - a.y); it.sats[i].style.display = visSat(a, s) ? '' : 'none'; });
  it.halo.setAttribute('cx', a.x.toFixed(1)); it.halo.setAttribute('cy', a.y.toFixed(1));
  it.halo.setAttribute('r', a.top ? (a.size * 1.05).toFixed(1) : 0);
  const live = livePods(a), ready = live.filter((p) => p.phase === 'Running').length;
  const count = a.kind === 'ds' ? `${ready}/${live.length} nodes` : `${ready}/${a.replicas}`;
  const metric = a.baseRps > 0 ? ' · ' + rate(a.rps) : ' · ' + cores(live.reduce((s, p) => s + p.cpu, 0)) + ' CPU';
  setLabel(it, a.x, a.y + a.size / 2 + 2, a.id, `${a.sys ? '' : KIND_NAME[a.kind] + ' · '}${count}${a.sys && a.kind === 'ds' ? '' : metric}`);
  dim(it, 'app:' + a.id, hl);
  showItem(it, visApp(a));
}

const POD_RING = { Pending: '#94a3b8', Unschedulable: '#dc2626', Creating: '#326ce5', CrashLoop: '#dc2626', Completed: '#16a34a' };
function updatePod(p, hl) {
  const it = ensure('pod:' + p.id, '#l-pods', buildPod(p));
  const a = S.apps.get(p.app), n = S.nodes.get(p.node);
  setT(it.g, p.x, p.y);
  it.tether.setAttribute('x1', a.x.toFixed(1)); it.tether.setAttribute('y1', a.y.toFixed(1));
  it.tether.setAttribute('x2', p.x.toFixed(1)); it.tether.setAttribute('y2', p.y.toFixed(1));
  const ring = POD_RING[p.phase];
  it.ring.setAttribute('stroke', ring || 'none');
  it.ring.setAttribute('stroke-dasharray', p.phase === 'Running' ? '' : '3 3');
  it.ring.setAttribute('stroke-dashoffset', p.phase === 'Creating' ? (-S.t * 12).toFixed(1) : 0);
  it.hot.setAttribute('opacity', p.phase === 'CrashLoop' ? 0.6 + 0.4 * Math.sin(S.t * 8) : 0);
  it.dot.setAttribute('fill', n ? n.color : '#fff');
  it.dot.setAttribute('stroke', n ? '#fff' : '#94a3b8');
  const age = S.t - p.since;
  const op = { Completed: 0.55, Pending: 0.4, Unschedulable: 0.45, Creating: 0.7, Terminating: Math.max(0, 1 - age / T_TERM) }[p.phase] ?? 1;
  const grow = clamp((S.t - p.born) / 0.5, 0.2, 1);
  setT(it.g, p.x, p.y, grow);
  dim(it, 'pod:' + p.id, hl);
  if (!hl || hl.has('pod:' + p.id)) it.g.style.opacity = op;
  it.tether.style.opacity = a.sys ? 0.4 : 1;
  showItem(it, visPod(p));
}

function updateLinks() {
  const api = S.ents.get('api');
  for (const l of R.cpLinks) {
    const e = S.ents.get(l.id);
    l.path.setAttribute('d', `M${api.x},${api.y}L${e.x},${e.y}`);
    l.path.style.display = visEnt(api) && visEnt(e) ? '' : 'none';
  }
  const seen = new Set();
  for (const n of S.nodes.values()) {
    seen.add(n.id);
    if (!R.kubeletLinks.has(n.id)) R.kubeletLinks.set(n.id, el('path', { class: 'cp-link' }, $('#l-links')));
    const path = R.kubeletLinks.get(n.id);
    path.setAttribute('d', `M${api.x.toFixed(1)},${api.y.toFixed(1)}L${n.x.toFixed(1)},${n.y.toFixed(1)}`);
    path.style.display = visEnt(api) && visNode(n) ? '' : 'none';
  }
  for (const [id, path] of R.kubeletLinks) if (!seen.has(id)) { path.remove(); R.kubeletLinks.delete(id); }
  updateThreads();
}

// Placement threads: one faint line in the node's colour from each node to every workload with pods on it.
function updateThreads() {
  if (!R.threads) R.threads = new Map();
  const live = placements();
  for (const [key, count] of live) {
    const [nid, aid] = key.split('>');
    const n = S.nodes.get(nid), a = S.apps.get(aid);
    if (!n || !a) continue;
    if (!R.threads.has(key)) R.threads.set(key, el('line', { class: 'thread' }, $('#l-links')));
    const ln = R.threads.get(key);
    ln.setAttribute('x1', n.x.toFixed(1)); ln.setAttribute('y1', n.y.toFixed(1));
    ln.setAttribute('x2', a.x.toFixed(1)); ln.setAttribute('y2', a.y.toFixed(1));
    ln.setAttribute('stroke', n.color);
    ln.setAttribute('stroke-width', (0.8 + 0.5 * Math.min(count, 4)).toFixed(1));
    ln.style.display = visNode(n) && visApp(a) ? '' : 'none';
    ln.style.opacity = a.sys ? 0.12 : 0.22;
  }
  for (const [key, ln] of R.threads) if (!live.has(key)) { ln.remove(); R.threads.delete(key); }
}

function edgePath(e) {
  const a = entityPos(e.from), b = entityPos(e.to);
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y;
  const bend = 0.12;
  return { a, b, c: { x: mx - dy * bend, y: my + dx * bend } };
}

function updateEdges() {
  if (!R.edgeEls) R.edgeEls = new Map();
  for (const e of S.edges) {
    const key = e.from + '>' + e.to;
    if (!R.edgeEls.has(key)) R.edgeEls.set(key, el('path', { class: 'edge' }, $('#l-edges')));
    const { a, b, c } = edgePath(e);
    const path = R.edgeEls.get(key);
    path.setAttribute('d', `M${a.x.toFixed(1)},${a.y.toFixed(1)}Q${c.x.toFixed(1)},${c.y.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}`);
    path.setAttribute('class', e.deny ? 'edge deny' : 'edge');
    const sys = entityPos(e.from).sys;
    path.style.opacity = sys ? 0.45 : '';
    path.style.display = visEdge(e) ? '' : 'none';
  }
}

function updateSelRing() {
  if (!R.selRing) R.selRing = el('circle', { class: 'sel-ring', r: 0 }, $('#l-toasts'));
  const t = S.sel && selTarget(S.sel);
  if (!t) { R.selRing.setAttribute('r', 0); return; }
  R.selRing.setAttribute('cx', t.x.toFixed(1)); R.selRing.setAttribute('cy', t.y.toFixed(1));
  R.selRing.setAttribute('r', t.r.toFixed(1));
}

function selTarget(key) {
  if (!visKey(key)) return null;
  const [type, id, i] = key.split(':');
  if (type === 'pod') { const p = S.pods.get(id); return p && { x: p.x, y: p.y, r: POD * 0.8 }; }
  if (type === 'node') { const n = S.nodes.get(id); return n && { x: n.x, y: n.y, r: 40 }; }
  if (type === 'ent') { const e = S.ents.get(id); return e && { x: e.x, y: e.y, r: 38 }; }
  const a = S.apps.get(id);
  if (!a) return null;
  if (type === 'sat') { const s = a.sats[+i]; if (!s || s.off) return null; const q = satPos(a, s); return { x: q.x, y: q.y, r: 20 }; }
  return { x: a.x, y: a.y, r: a.size / 2 + 8 };
}
// Canvas overlay: traffic particles on app edges (Hubble flows), dropped flows, and control-flow pulses
// that travel along the web (API server → scheduler → node → pod). Toasts are short SVG captions near the object.
const FX = { cv: null, cx: null, dpr: 1, parts: [], drops: [], pulses: [], toasts: [], acc: new Map() };

function sizeCanvas() {
  FX.cv = $('#fx');
  FX.dpr = Math.min(2, devicePixelRatio || 1);
  FX.cv.width = innerWidth * FX.dpr;
  FX.cv.height = innerHeight * FX.dpr;
  FX.cx = FX.cv.getContext('2d');
}

function qPoint(e, t) {
  const { a, b, c } = edgePath(e);
  const u = 1 - t;
  return { x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, y: u * u * a.y + 2 * u * t * c.y + t * t * b.y };
}

function spawnTraffic(dt) {
  for (const e of S.edges) {
    if (!visEdge(e)) continue;
    const key = e.from + '>' + e.to;
    const acc = (FX.acc.get(key) || 0) + dt * Math.min(9, edgeRate(e) / 28);
    let n = Math.floor(acc);
    FX.acc.set(key, acc - n);
    while (n-- > 0 && FX.parts.length < 600) FX.parts.push({ e, t: 0, v: 0.35 + rand() * 0.15 });
  }
}

function stepFx(dt) {
  if (S.warp) { FX.parts.length = 0; return; }
  spawnTraffic(dt);
  for (const p of FX.parts) {
    p.t += p.v * dt;
    if (p.e.deny && p.t >= 0.82 && !p.dropped) { p.dropped = true; FX.drops.push({ pt: qPoint(p.e, 0.82), t0: S.t }); }
  }
  FX.parts = FX.parts.filter((p) => p.t < 1 && !p.dropped && S.edges.includes(p.e) && visEdge(p.e));
  FX.drops = FX.drops.filter((d) => S.t - d.t0 < 1.2);
  FX.pulses = FX.pulses.filter((q) => S.t - q.t0 < q.dur + 0.8);
  stepToasts();
}

function drawFx() {
  const c = FX.cx;
  c.setTransform(FX.dpr, 0, 0, FX.dpr, 0, 0);
  c.clearRect(0, 0, innerWidth, innerHeight);
  c.setTransform(FX.dpr * V.k, 0, 0, FX.dpr * V.k, FX.dpr * V.tx, FX.dpr * V.ty);
  for (const p of FX.parts) {
    const pt = qPoint(p.e, p.t);
    c.globalAlpha = entityPos(p.e.from).sys ? 0.35 : 0.9;
    c.fillStyle = '#3b82f6';
    c.beginPath(); c.arc(pt.x, pt.y, 2.6, 0, Math.PI * 2); c.fill();
  }
  c.globalAlpha = 1;
  for (const d of FX.drops) drawDrop(c, d);
  for (const q of FX.pulses) drawPulse(c, q);
}

function drawDrop(c, d) {
  const s = 6, a = 1 - (S.t - d.t0) / 1.2;
  c.globalAlpha = Math.max(0, a);
  c.strokeStyle = '#dc2626'; c.lineWidth = 2.4;
  c.beginPath();
  c.moveTo(d.pt.x - s, d.pt.y - s); c.lineTo(d.pt.x + s, d.pt.y + s);
  c.moveTo(d.pt.x + s, d.pt.y - s); c.lineTo(d.pt.x - s, d.pt.y + s);
  c.stroke();
  c.globalAlpha = 1;
}

// A pulse travels a polyline of live points (functions, so it follows moving pods).
function drawPulse(c, q) {
  const pts = q.pts.map((f) => f()).filter(Boolean);
  if (pts.length < 2) return;
  const prog = clamp((S.t - q.t0) / q.dur, 0, 1), fade = clamp(1 - (S.t - q.t0 - q.dur) / 0.8, 0, 1);
  const segs = pts.length - 1, upto = prog * segs;
  c.strokeStyle = q.color; c.lineWidth = 2; c.globalAlpha = 0.55 * fade;
  c.beginPath(); c.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i <= Math.ceil(upto); i++) {
    const f = Math.min(1, upto - (i - 1));
    c.lineTo(lerp(pts[i - 1].x, pts[i].x, f), lerp(pts[i - 1].y, pts[i].y, f));
  }
  c.stroke();
  const i = Math.min(segs - 1, Math.floor(upto)), f = upto - i;
  c.globalAlpha = fade; c.fillStyle = q.color;
  c.beginPath(); c.arc(lerp(pts[i].x, pts[i + 1].x, f), lerp(pts[i].y, pts[i + 1].y, f), 5, 0, Math.PI * 2); c.fill();
  c.globalAlpha = 1;
}

const at = (o) => () => o && (o.gone || (o.phase === 'Terminating' && o.app) ? null : { x: o.x, y: o.y });

function fxSchedule(p, n) {
  if (S.warp) return;
  FX.pulses.push({ pts: [at(S.ents.get('api')), at(S.ents.get('sched')), at(S.ents.get('api')), at(n), at(p)], t0: S.t, dur: 1.6, color: '#326ce5' });
}

function fxApiCall(from, a) {
  if (S.warp) return;
  const api = at(S.ents.get('api')), cm = at(S.ents.get('cm'));
  // kubectl: presenter → API → controller-manager reacts → API → workload; HPA lives in the controller-manager.
  const pts = from === 'kubectl' ? [api, cm, api, at(a)] : [cm, api, at(a)];
  FX.pulses.push({ pts, t0: S.t, dur: 1.4, color: '#7c3aed' });
}

function fxNodeJoin(n) {
  if (S.warp) return;
  FX.pulses.push({ pts: [at(S.ents.get('ca')), at(S.ents.get('api')), at(n)], t0: S.t, dur: 1.4, color: '#0d9488' });
}
// Toasts: short captions next to the object that changed ("cart 2 → 5 replicas"), fading after a few seconds.
// They are the only narration on the page: no bars or menus.
const TOAST_LIFE = 5;

function fxToast(obj, kind, msg, warn) {
  if (S.warp || !obj || !visAny(obj)) return;
  const near = FX.toasts.filter((t) => Math.hypot(t.x - obj.x, t.y - obj.y) < 90 && S.t - t.t0 < TOAST_LIFE).length;
  const g = el('g', {}, $('#l-toasts'));
  const txt = el('text', { class: 'lbl toast', 'text-anchor': 'middle' }, g);
  el('tspan', { class: 'k' }, txt).textContent = kind + '  ';
  const body = el('tspan', {}, txt);
  body.textContent = msg;
  if (warn) body.setAttribute('fill', '#b91c1c');
  const lift = (obj.size || (obj.app ? POD : 54)) / 2 + 14;
  FX.toasts.push({ g, x: obj.x, y: obj.y, lift, slot: near, t0: S.t });
  if (FX.toasts.length > 8) FX.toasts.shift().g.remove();
}

function stepToasts() {
  FX.toasts = FX.toasts.filter((t) => {
    const age = S.t - t.t0;
    if (age > TOAST_LIFE) { t.g.remove(); return false; }
    const y = t.y - t.lift - (t.slot * 20 + age * 3) * V.inv;
    setT(t.g, t.x, y, V.inv);
    t.g.style.opacity = clamp(Math.min(age / 0.3, (TOAST_LIFE - age) / 1), 0, 1);
    return true;
  });
}

function clearToasts() {
  for (const t of FX.toasts) t.g.remove();
  FX.toasts = [];
  FX.parts = []; FX.drops = []; FX.pulses = [];
}
// Click panel: the only surface. Opens on a click, closes on Esc or a click on empty space; refreshes live once a second.
const PN = { acc: 0, key: null };

function select(key) {
  S.sel = key;
  const panel = $('#panel');
  if (!key) { panel.classList.remove('open'); PN.key = null; return; }
  PN.key = key;
  panel.classList.add('open');
  renderPanel(true);
}

function stepPanel(dt) {
  if (!S.sel) return;
  if (!selTarget(S.sel)) { select(null); return; }
  PN.acc += dt;
  if (PN.acc >= 1) { PN.acc = 0; renderPanel(false); }
}

function renderPanel(fresh) {
  const panel = $('#panel');
  const [type, id, i] = S.sel.split(':');
  const view = { app: appView, pod: podView, node: nodeView, ent: entView, sat: satView }[type](id, i);
  const body = panel.querySelector('.p-body');
  const scroll = body && !fresh ? body.scrollTop : 0;
  const logs = body && body.querySelector('pre.logs');
  const stick = !logs || logs.scrollTop + logs.clientHeight >= logs.scrollHeight - 8;
  panel.innerHTML = `<div class="p-head"><svg viewBox="0 0 18 17.5"><use href="#k-${view.icon}"/></svg>
    <div><div class="p-title">${esc(view.title)}</div><div class="p-kind">${esc(view.kind)}</div></div>
    <button class="p-x" aria-label="Close" data-close>×</button></div>
    <div class="p-body">${view.sections.join('')}</div>`;
  panel.querySelector('.p-body').scrollTop = scroll;
  const nl = panel.querySelector('pre.logs');
  if (nl && (stick || fresh)) nl.scrollTop = nl.scrollHeight;
}

function wirePanel() {
  $('#panel').addEventListener('click', (ev) => {
    if (ev.target.closest('[data-close]')) select(null);
    const chip = ev.target.closest('[data-go]');
    if (chip) select(chip.getAttribute('data-go'));
  });
}

function sec(title, html) { return `<div class="p-sec"><h5>${esc(title)}</h5>${html}</div>`; }
function kv(rows) { return `<div class="kv">${rows.map(([k, v]) => `<span>${esc(k)}</span><span>${esc(v)}</span>`).join('')}</div>`; }
function yaml(text) { return `<pre>${esc(text)}</pre>`; }
function chips(items) { return `<div class="chips">${items.map(([key, label]) => `<span class="chip" data-go="${key}">${esc(label)}</span>`).join('')}</div>`; }

function spark(vals, color, max) {
  if (!vals.length) return '<svg></svg>';
  const n = vals.length, hi = max || Math.max(1e-6, ...vals) * 1.15;
  const pts = vals.map((v, i) => `${((i / Math.max(1, n - 1)) * 100).toFixed(1)},${(32 - (v / hi) * 30).toFixed(1)}`);
  return `<svg viewBox="0 0 100 34" preserveAspectRatio="none"><polyline points="0,34 ${pts.join(' ')} 100,34" fill="${color}" fill-opacity="0.12" stroke="none"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function metric(label, value, vals, color, max) { return `<div>${esc(label)}<b>${esc(value)}</b>${spark(vals, color || '#326ce5', max)}</div>`; }
function metrics(items) { return sec('Metrics · last 90 s', `<div class="met">${items.join('')}</div>`); }

function eventsFor(match) {
  const rows = S.events.filter((e) => match(e.obj)).slice(-8).reverse();
  if (!rows.length) return sec('Events', '<pre class="d">no recent events</pre>');
  return sec('Events', `<pre>${rows.map((e) => `<span class="d">${ago(S.t - e.t).padStart(6)}</span>  ${e.type === 'Warning' ? '<span class="w">' + e.reason + '</span>' : e.reason}  ${esc(e.msg)}`).join('\n')}</pre>`);
}

function logsSec(title, lines) {
  return sec(title, `<pre class="logs">${lines.map((l) => (l.cls ? `<span class="${l.cls}">${esc(l.text)}</span>` : esc(l.text))).join('\n')}</pre>`);
}
// Panel views per object type: config (YAML as kubectl would print it), metrics, events and logs.
function appView(id) {
  const a = S.apps.get(id), pods = livePods(a);
  const kind = KIND_NAME[a.kind];
  const cpu = a.hist.cpu.at(-1) || 0, mem = a.hist.mem.at(-1) || 0;
  const m = [
    metric('Replicas', `${running(a).length} / ${a.kind === 'ds' ? pods.length : a.replicas}`, a.hist.replicas, '#7c3aed'),
    metric('Requests', rate(a.rps), a.hist.rps, '#3b82f6'),
    metric('CPU', cores(cpu) + ' cores', a.hist.cpu, '#0d9488'),
    metric('Memory', mib(mem), a.hist.mem, '#ea580c'),
  ];
  const first = pods.find((p) => p.phase === 'Running') || pods[0];
  return {
    icon: KIND_ICON[a.kind], title: a.id, kind: `${kind} · namespace ${a.ns}`,
    sections: [
      metrics(m),
      sec('Pods', chips(pods.map((p) => ['pod:' + p.id, p.name.replace(a.id + '-', '') + ' · ' + p.phase]))),
      sec('Config', yaml(appYaml(a))),
      eventsFor((o) => o.endsWith('/' + a.id) || o.startsWith('Pod/' + a.id + '-')),
      first ? logsSec(`Logs · kubectl logs ${a.kind === 'sts' ? 'sts' : a.kind === 'ds' ? 'ds' : 'deploy'}/${a.id}`, podLogs(first, 14)) : '',
      `<div class="note">Simulated data. The real build reads this from the API server, metrics.k8s.io and Hubble.</div>`,
    ],
  };
}

function podView(id) {
  const p = S.pods.get(id), a = S.apps.get(p.app), n = S.nodes.get(p.node);
  return {
    icon: 'pod', title: p.name, kind: `Pod · namespace ${a.ns}`,
    sections: [
      sec('Status', kv([['Phase', p.phase === 'CrashLoop' ? 'CrashLoopBackOff' : p.phase], ['Node', n ? n.name : '—'], ['Pod IP', p.ip || '—'],
        ['Restarts', String(p.restarts)], ['Age', ago(S.t - p.born + 3600 * (p.born === 0 ? 1 : 0))], ['Owner', (a.kind === 'deploy' ? 'ReplicaSet ' + a.id + '-' + p.rs.slice(0, 5) : KIND_NAME[a.kind] + ' ' + a.id)]])),
      metrics([metric('CPU', Math.round(p.cpu) + 'm', p.hist.cpu, '#0d9488', a.cpu * 1.8), metric('Memory', mib(p.mem), p.hist.mem, '#ea580c', a.mem * 1.5)]),
      n ? sec('Node', chips([['node:' + n.id, 'node ' + n.short], ['app:' + a.id, KIND_NAME[a.kind] + ' ' + a.id]])) : '',
      logsSec('Logs · kubectl logs ' + p.name, podLogs(p, 18)),
      sec('Config', yaml(podYaml(p, a, n))),
      eventsFor((o) => o === 'Pod/' + p.name),
    ],
  };
}

function nodeView(id) {
  const n = S.nodes.get(id), pods = nodePods(n), used = nodeUsed(n);
  return {
    icon: 'node', title: n.name, kind: `Node · ${n.type} · ${n.zone}`,
    sections: [
      sec('Status', kv([['Condition', n.phase], ['Pods', pods.length + ' / 110'], ['CPU requested', `${cores(used.cpu)} / ${cores(n.cpuAlloc)} cores`],
        ['Memory requested', `${mib(used.mem)} / ${mib(n.memAlloc)}`], ['Kubelet', 'v1.34.1-gke.1200'], ['Runtime', 'containerd://2.0.6']])),
      metrics([metric('CPU usage', Math.round(n.hist.cpu.at(-1) || 0) + '%', n.hist.cpu, '#0d9488', 100), metric('Memory usage', Math.round(n.hist.mem.at(-1) || 0) + '%', n.hist.mem, '#ea580c', 100)]),
      sec('Pods on this node', chips(pods.map((p) => ['pod:' + p.id, p.name]))),
      logsSec('Logs · kubelet (journal)', kubeletLogs(n, 12)),
      sec('Config', yaml(nodeYaml(n))),
      eventsFor((o) => o === 'Node/' + n.name),
    ],
  };
}

function entView(id) {
  const e = S.ents.get(id);
  if (e.type === 'ext') return extView(e);
  return {
    icon: e.icon, title: e.name, kind: 'Control plane · ' + e.sub,
    sections: [
      sec('Status', kv([['Health', '/readyz ok'], ['Seen via', id === 'api' ? 'API server /metrics' : 'Lease kube-system/' + e.name], ['Version', 'v1.34.1-gke.1200']])),
      metrics([metric(id === 'api' ? 'API requests' : 'Leader renewals', id === 'api' ? rate(e.rps) : '0.5/s', id === 'api' ? e.hist.rps : e.hist.rps.map(() => 0.5), '#326ce5')]),
      logsSec('Recent activity', cpLogs(id, 12)),
      `<div class="note">GKE manages the control plane, so it has no visible Pods. This part is inferred from Leases, /readyz and API server metrics.</div>`,
    ],
  };
}

function extView(e) {
  if (e.id === 'internet') return { icon: 'ing', title: 'internet', kind: 'Outside the cluster', sections: [sec('Traffic', kv([['Into the cluster', rate(e.rps)]]))] };
  return {
    icon: 'ing', title: e.name, kind: 'Ingress · namespace shop',
    sections: [metrics([metric('Requests', rate(e.rps), e.hist.rps, '#3b82f6')]), sec('Config', yaml(ingYaml())), eventsFor((o) => o === 'Ingress/shop-ingress')],
  };
}

function satView(id, i) {
  const a = S.apps.get(id), s = a.sats[+i];
  const titles = { svc: [a.id, 'Service'], cm: [a.id + '-config', 'ConfigMap'], hpa: [a.id, 'HorizontalPodAutoscaler'], pvc: ['data-' + a.id + '-0', 'PersistentVolumeClaim'], netpol: ['deny-' + a.id + '-from-frontend', 'NetworkPolicy'] };
  const [title, kind] = titles[s.kind];
  const extra = s.kind === 'svc' ? sec('Endpoints', chips(running(a).map((p) => ['pod:' + p.id, p.ip + ':' + a.port])))
    : s.kind === 'hpa' ? metrics([metric('CPU vs target ' + a.hpa.target + '%', Math.round(a.util * 100) + '%', a.hist.cpu.map((c, k) => c / Math.max(1, a.hist.replicas[k] || 1) / a.cpu * 100), '#d97706'), metric('Replicas', String(a.replicas), a.hist.replicas, '#7c3aed')]) : '';
  return {
    icon: s.kind, title, kind: `${kind} · namespace ${a.ns}`,
    sections: [extra, sec('Config', yaml(satYaml(a, s.kind))), eventsFor((o) => o === kind + '/' + a.id || (s.kind === 'hpa' && o === 'Deployment/' + a.id))],
  };
}
// Config views: trimmed YAML in the shape `kubectl get -o yaml` prints (status and managedFields omitted).
function appYaml(a) {
  const api = a.kind === 'job' ? 'batch/v1' : 'apps/v1';
  const lines = [`apiVersion: ${api}`, `kind: ${KIND_NAME[a.kind]}`, 'metadata:', `  name: ${a.id}`, `  namespace: ${a.ns}`,
    `  labels: {app: ${a.id}}`, 'spec:'];
  if (a.kind === 'job') lines.push(`  parallelism: ${a.replicas}`, '  completions: 6');
  else if (a.kind !== 'ds') lines.push(`  replicas: ${a.replicas}`);
  if (a.kind === 'deploy') lines.push('  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 25%, maxUnavailable: 25%}}');
  lines.push(`  selector: {matchLabels: {app: ${a.id}}}`, '  template:', `    metadata: {labels: {app: ${a.id}}}`, '    spec:', '      containers:',
    `      - name: ${a.id}`, `        image: ${a.image}`);
  if (a.port && a.baseRps) lines.push(`        ports: [{containerPort: ${a.port}}]`);
  lines.push('        resources:', `          requests: {cpu: ${a.cpu}m, memory: ${a.mem}Mi}`, `          limits: {memory: ${a.mem * 2}Mi}`);
  if (a.baseRps) lines.push(`        readinessProbe: {httpGet: {path: /_healthz, port: ${a.port}}, periodSeconds: 5}`);
  if (a.kind === 'job') lines.push('      restartPolicy: Never');
  return lines.join('\n');
}

function podYaml(p, a, n) {
  return ['apiVersion: v1', 'kind: Pod', 'metadata:', `  name: ${p.name}`, `  namespace: ${a.ns}`, `  labels: {app: ${a.id}, pod-template-hash: ${p.rs.slice(0, 9)}}`,
    `  ownerReferences: [{kind: ${a.kind === 'deploy' ? 'ReplicaSet' : KIND_NAME[a.kind]}, name: ${a.kind === 'deploy' ? a.id + '-' + p.rs.slice(0, 5) : a.id}}]`,
    'spec:', `  nodeName: ${n ? n.name : '""'}`, '  containers:', `  - name: ${a.id}`, `    image: ${a.image}`,
    `    resources: {requests: {cpu: ${a.cpu}m, memory: ${a.mem}Mi}}`, 'status:', `  phase: ${p.phase === 'Running' || p.phase === 'CrashLoop' ? 'Running' : 'Pending'}`,
    `  podIP: ${p.ip || '""'}`, `  qosClass: Burstable`].join('\n');
}

function nodeYaml(n) {
  return ['apiVersion: v1', 'kind: Node', 'metadata:', `  name: ${n.name}`, '  labels:', `    topology.kubernetes.io/zone: ${n.zone}`,
    `    node.kubernetes.io/instance-type: ${n.type}`, '    cloud.google.com/gke-nodepool: default-pool', 'spec:',
    `  providerID: gce://exact-loon-6dim/${n.zone}/${n.name}`, n.phase === 'Draining' ? '  unschedulable: true' : '  podCIDR: 10.52.' + (S.nodeSeq + 1) + '.0/24',
    'status:', `  allocatable: {cpu: ${n.cpuAlloc}m, memory: ${n.memAlloc}Mi, pods: "110"}`].join('\n');
}

function ingYaml() {
  return ['apiVersion: networking.k8s.io/v1', 'kind: Ingress', 'metadata: {name: shop-ingress, namespace: shop}', 'spec:', '  rules:', '  - http:', '      paths:',
    '      - path: /', '        pathType: Prefix', '        backend: {service: {name: frontend, port: {number: 80}}}'].join('\n');
}

function satYaml(a, kind) {
  if (kind === 'svc') return ['apiVersion: v1', 'kind: Service', `metadata: {name: ${a.id}, namespace: ${a.ns}}`, 'spec:', '  type: ClusterIP',
    `  clusterIP: 10.56.${a.port % 200}.${a.id.length * 7}`, `  selector: {app: ${a.id}}`, `  ports: [{port: ${a.id === 'frontend' ? 80 : a.port}, targetPort: ${a.port}}]`].join('\n');
  if (kind === 'hpa') return ['apiVersion: autoscaling/v2', 'kind: HorizontalPodAutoscaler', `metadata: {name: ${a.id}, namespace: ${a.ns}}`, 'spec:',
    `  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ${a.id}}`, `  minReplicas: ${a.hpa.min}`, `  maxReplicas: ${a.hpa.max}`,
    '  metrics:', `  - resource: {name: cpu, target: {type: Utilization, averageUtilization: ${a.hpa.target}}}`, '    type: Resource'].join('\n');
  if (kind === 'cm') return ['apiVersion: v1', 'kind: ConfigMap', `metadata: {name: ${a.id}-config, namespace: ${a.ns}}`, 'data:',
    '  PRODUCT_CATALOG_SERVICE_ADDR: productcatalog:3550', '  CART_SERVICE_ADDR: cart:7070', '  ENABLE_PROFILER: "0"'].join('\n');
  if (kind === 'pvc') return ['apiVersion: v1', 'kind: PersistentVolumeClaim', `metadata: {name: data-${a.id}-0, namespace: ${a.ns}}`, 'spec:',
    '  accessModes: [ReadWriteOnce]', '  storageClassName: standard-rwo', '  resources: {requests: {storage: 1Gi}}', 'status: {phase: Bound}'].join('\n');
  return ['apiVersion: networking.k8s.io/v1', 'kind: NetworkPolicy', `metadata: {name: deny-${a.id}-from-frontend, namespace: ${a.ns}}`, 'spec:',
    `  podSelector: {matchLabels: {app: ${a.id}}}`, '  policyTypes: [Ingress]', '  ingress:', '  - from: [{podSelector: {matchLabels: {app: loadgenerator}}}]'].join('\n');
}
// Simulated logs: a deterministic stream per object (line i always reads the same), so the panel scrolls like `kubectl logs -f`.
function h32(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}
const pick = (arr, h) => arr[Math.abs(h | 0) % arr.length]; // `h >> n` can be negative
const PRODUCTS = ['OLJCESPC7Z', '66VCHSJNUP', '1YMWWN1N4O', 'L9ECAV7KIM', '2ZYFJ3GM2N', '0PUK6V6EV0', 'LS4PSXUNUM', '9SIQT8TOJO'];

const APP_LOG = {
  frontend: (h, a) => a.util > 1.1 && h % 3 === 0
    ? { text: `severity=warning msg="request slow" path=/cart latency=${800 + (h % 900)}ms`, cls: 'w' }
    : { text: `http.req.method=${pick(['GET', 'GET', 'GET', 'POST'], h)} http.req.path=${pick(['/', '/product/' + pick(PRODUCTS, h >> 3), '/cart', '/cart/checkout'], h >> 5)} http.resp.status=200 http.resp.took_ms=${4 + (h % 40)}` },
  productcatalog: (h) => ({ text: pick([`[GetProduct] id=${pick(PRODUCTS, h >> 2)}`, '[ListProducts] 9 products', `[SearchProducts] query="${pick(['mug', 'watch', 'tank'], h >> 4)}"`], h) }),
  cart: (h) => ({ text: pick([`GetCartAsync called with userId=${(h % 0xffffff).toString(16)}-7e2f`, `AddItemAsync called with userId=${(h % 0xffffff).toString(16)}-7e2f, productId=${pick(PRODUCTS, h >> 3)}, quantity=${1 + (h % 3)}`, 'EmptyCartAsync called'], h) }),
  'redis-cart': (h) => ({ text: pick(['1:M * 10 changes in 300 seconds. Saving...', '1:M * Background saving started', '1:C * DB saved on disk', '1:M * Background saving terminated with success'], h) }),
  checkout: (h) => ({ text: pick([`[PlaceOrder] user_id=${(h % 0xfffff).toString(16)} user_currency=EUR`, `payment went through (transaction_id: ${(h % 0xffffffff).toString(16)}-4b1e)`, `order confirmation email sent to "someone@example.com"`], h) }),
  payment: (h) => ({ text: `Transaction processed: visa ending ${1000 + (h % 9000)}  Amount: EUR ${(h % 200) + 0.99}` }),
  loadgenerator: (h) => ({ text: `${pick(['GET /', 'GET /product/' + pick(PRODUCTS, h >> 2), 'POST /cart', 'POST /cart/checkout'], h)}  200  ${10 + (h % 60)}ms   users=${50}` }),
  'kube-dns': (h) => ({ text: `[INFO] 10.52.1.${h % 250}:${40000 + (h % 20000)} - "A IN ${pick(['cart', 'productcatalog', 'checkout', 'redis-cart', 'payment'], h >> 3)}.shop.svc.cluster.local. udp" NOERROR qr,aa,rd 0.000${1 + (h % 9)}s` }),
  render: (h) => ({ text: `frame ${h % 4000} rendered in ${(1 + (h % 30) / 10).toFixed(1)}s (tile ${h % 64}/64)` }),
};

function genericLog(h, a) {
  return { text: `level=info msg="${pick(['reconciled', 'synced informer caches', 'scrape ok', 'heartbeat'], h)}" component=${a.id}` };
}

function podLogs(p, count) {
  const a = S.apps.get(p.app);
  const ratePerSec = a.baseRps ? 1.6 : 0.5;
  const end = Math.floor((S.t - p.born) * ratePerSec);
  const out = [];
  if (p.phase === 'Pending' || p.phase === 'Unschedulable') return [{ text: 'container has not started: pod is not scheduled yet', cls: 'd' }];
  if (p.phase === 'Creating') return [{ text: 'container is starting: pulling image ' + a.image, cls: 'd' }];
  for (let i = Math.max(0, end - count); i <= end; i++) {
    const h = h32(p.id + ':' + i);
    const ts = clock(p.born + i / ratePerSec);
    const line = (APP_LOG[a.id] || genericLog)(h, a);
    out.push({ text: ts + '  ' + line.text, cls: line.cls });
  }
  if (p.phase === 'CrashLoop') out.push({ text: clock(p.since) + '  panic: runtime error: invalid memory address or nil pointer dereference', cls: 'e' }, { text: clock(p.since) + '  goroutine 1 [running]: main.main() /src/main.go:212', cls: 'e' });
  return out;
}

function kubeletLogs(n, count) {
  const end = Math.floor(S.t * 0.8), out = [];
  for (let i = Math.max(0, end - count); i <= end; i++) {
    const h = h32(n.id + ':k:' + i);
    const pods = nodePods(n);
    const p = pods.length ? pods[h % pods.length] : null;
    const text = p ? pick([`"SyncLoop (PLEG): event for pod" pod="${S.apps.get(p.app).ns}/${p.name}" event=ContainerStarted`, `"Probe succeeded" probeType="Readiness" pod="${p.name}"`, '"Updated node status" node="' + n.name + '"'], h)
      : 'Node is registering with the API server';
    out.push({ text: clock(i / 0.8) + '  I1109 kubelet.go:' + (2400 + (h % 300)) + '] ' + text });
  }
  return out;
}

function cpLogs(id, count) {
  const rows = S.events.slice(-60).filter((e) => (id === 'sched' ? e.reason === 'Scheduled' || e.reason === 'FailedScheduling'
    : id === 'cm' ? /Create|Rescale|Scaling|Killing/.test(e.reason) : id === 'ca' ? /Node|ScaleDown|TriggeredScaleUp/.test(e.reason) : true));
  if (!rows.length) return [{ text: 'no activity in the last minutes', cls: 'd' }];
  return rows.slice(-count).map((e) => ({ text: clock(e.t) + '  ' + e.reason + '  ' + e.obj + '  ' + e.msg, cls: e.type === 'Warning' ? 'w' : '' }));
}
// Demo loop: a deterministic ~2-minute story that replays forever. In the real tool these changes come
// from the presenter's kubectl; here they are scripted so the mockup runs unattended.
const SCN = { t: 0, i: 0, period: 124 };
const SPARE_NODES = ['d8e4', 'e1f6', 'f3a2', 'g9b7'];

const STORY = [
  { t: 4, fn: () => scaleTo(app('frontend'), 5, 'kubectl') },
  { t: 16, fn: () => startRollout(app('productcatalog'), 'v0.10.3') },
  { t: 30, fn: () => setLoad('cart', 3, 'traffic spike') },
  { t: 46, fn: startRenderJob },
  { t: 66, fn: () => crashPod('checkout') },
  { t: 72, fn: () => crashPod('checkout') },
  { t: 78, fn: () => setPolicy(true) },
  { t: 88, fn: () => setLoad('cart', 1, 'traffic back to normal') },
  { t: 100, fn: finishRenderJob },
  { t: 104, fn: removeRenderJob },
  { t: 108, fn: scaleDownSpareNode },
  { t: 113, fn: scaleDownSpareNode },
  { t: 118, fn: () => { scaleTo(app('frontend'), 3, 'kubectl'); setPolicy(false); } },
];

function app(id) { return S.apps.get(id); }

function stepScenario(dt) {
  SCN.t += dt;
  while (SCN.i < STORY.length && SCN.t >= STORY[SCN.i].t) STORY[SCN.i++].fn();
  if (SCN.t >= SCN.period) { SCN.t = 0; SCN.i = 0; }
  for (const a of S.apps.values()) if (a.rolling) stepRollout(a);
  autoscalerLoop();
}

// Hidden key "→": jump straight to the next story beat.
function nextBeat() {
  if (SCN.i >= STORY.length) { SCN.t = SCN.period; return; }
  SCN.t = STORY[SCN.i].t;
}

function restartScenario() {
  resetWorld();
  clearToasts();
  initCaps();
  rankApps();
  settleLayout(400);
  Object.assign(SCN, { t: 0, i: 0 });
  select(null);
}

function setLoad(id, load, why) {
  const a = app(id);
  a.load = load;
  fxToast(a, 'traffic', `${id} ${why}`, load > 1);
}

// Rolling update with maxSurge 1, maxUnavailable 0: add one new pod, wait until it runs, retire one old pod.
function startRollout(a, tag) {
  a.rev += 1;
  a.rs = rid(9);
  a.image = a.image.replace(/:[^:]+$/, ':' + tag);
  a.rolling = true;
  addEvent('Deployment/' + a.id, 'ScalingReplicaSet', `Scaled up replica set ${a.id}-${a.rs.slice(0, 5)} (revision ${a.rev})`);
  fxToast(a, 'rollout', `${a.id} → ${tag}`);
  fxApiCall('kubectl', a);
}

function stepRollout(a) {
  const live = livePods(a);
  const olds = live.filter((p) => p.rs !== a.rs), news = live.filter((p) => p.rs === a.rs);
  if (!olds.length) { a.rolling = false; fxToast(a, 'rollout', a.id + ' complete'); return; }
  if (news.some((p) => p.phase !== 'Running')) return;
  if (live.length <= a.replicas) createPod(a, false, null);
  else terminatePod(olds.sort((p, q) => p.born - q.born)[0], 'rollout');
}

// A Job whose CPU requests outgrow the cluster: some pods stay Pending until the autoscaler adds a node.
function startRenderJob() {
  if (app('render')) return;
  const a = addApp('render', {
    kind: 'job', x: 1440, y: 1000, replicas: 6, cpu: 1600, mem: 512, baseRps: 0,
    image: 'us-docker.pkg.dev/demo/render:v2', sats: [], born: S.t,
  });
  a.cap = 0;
  addEvent('Job/render', 'SuccessfulCreate', 'Created 6 pods (parallelism 6)');
  fxToast(a, 'Job', 'render · 6 pods × 1600m CPU');
  fxApiCall('kubectl', a);
}

function finishRenderJob() {
  const a = app('render');
  if (!a) return;
  a.done = true;
  for (const p of appPods(a)) {
    if (p.phase === 'Running') { p.phase = 'Completed'; p.since = S.t; } else S.pods.delete(p.id);
  }
  addEvent('Job/render', 'Completed', 'Job completed');
  fxToast(a, 'Job', 'render complete');
}

function removeRenderJob() {
  const a = app('render');
  if (!a) return;
  for (const p of appPods(a)) S.pods.delete(p.id);
  S.apps.delete('render');
}

// Cluster autoscaler: Pending pods that no node fits trigger a scale-up, one node at a time.
function autoscalerLoop() {
  const ns = liveNodes();
  if (ns.some((n) => n.phase === 'Provisioning' || n.phase === 'NotReady') || ns.length >= 6) return;
  // Give Pending pods one retry on a freshly Ready node before asking for another one.
  if (ns.some((n) => n.phase === 'Ready' && S.t - n.since < 3.5)) return;
  const stuck = [...S.pods.values()].find((p) => p.phase === 'Unschedulable' && S.t - p.born > 2);
  if (!stuck) return;
  const name = SPARE_NODES.find((id) => !S.nodes.has(id));
  if (!name) return;
  const n = addNode(name, false);
  addEvent('Pod/' + stuck.name, 'TriggeredScaleUp', 'pod triggered scale-up: default-pool 3 → ' + liveNodes().length);
  fxToast(S.ents.get('ca'), 'autoscaler', 'Pending pods → add node ' + name, true);
  fxNodeJoin(n);
}

function scaleDownSpareNode() {
  const n = liveNodes().find((x) => SPARE_NODES.includes(x.id) && x.phase === 'Ready');
  if (!n) return;
  fxToast(S.ents.get('ca'), 'autoscaler', n.short + ' underused → remove');
  drainNode(n);
}

function crashPod(id) {
  const p = running(app(id))[0];
  if (!p) return;
  p.phase = 'CrashLoop';
  p.since = S.t;
  addEvent('Pod/' + p.name, 'BackOff', 'Back-off restarting failed container ' + id, 'Warning');
  fxToast(p, 'kubelet', 'CrashLoopBackOff · restarting', true);
}

function setPolicy(on) {
  const a = app('checkout');
  const sat = a.sats.find((s) => s.kind === 'netpol');
  sat.off = !on;
  for (const e of S.edges) if (e.from === 'frontend' && e.to === 'checkout') e.deny = on;
  if (on) {
    addEvent('NetworkPolicy/deny-checkout-from-frontend', 'Applied', 'ingress to checkout allowed only from loadgenerator');
    fxToast(a, 'NetworkPolicy', 'frontend → checkout denied', true);
    fxApiCall('kubectl', a);
  }
}
// Filter: a small pill in the corner that opens a list of switches, one per component group.
// Everything is on by default; hidden groups leave the page, the layout and the camera fit.
const FILTERS = [
  { id: 'cp', label: 'Control plane', icon: 'api' },
  { id: 'nodes', label: 'Nodes', icon: 'node' },
  { id: 'apps', label: 'Workloads', icon: 'deploy' },
  { id: 'pods', label: 'Pods', icon: 'pod' },
  { id: 'config', label: 'Services & config', icon: 'svc' },
  { id: 'traffic', label: 'Traffic', icon: 'ep' },
  { id: 'ext', label: 'Internet & ingress', icon: 'ing' },
  { id: 'system', label: 'System add-ons', icon: 'ds' },
];
const F = Object.fromEntries(FILTERS.map((f) => [f.id, true]));
const FUI = { open: false };

function visEnt(e) { return !!e && (e.type === 'ext' ? F.ext : F.cp); }
function visNode(n) { return !!n && !n.gone && F.nodes; }
function visApp(a) { return !!a && (a.sys ? F.system : F.apps); }
function visPod(p) { return !!p && F.pods && visApp(S.apps.get(p.app)); }
function visSat(a, s) { return F.config && visApp(a) && !s.off; }
function visEdge(e) { return F.traffic && visAny(entityPos(e.from)) && visAny(entityPos(e.to)); }
function visAny(o) {
  if (!o) return false;
  if (S.apps.get(o.id) === o) return visApp(o);
  if (S.nodes.get(o.id) === o) return visNode(o);
  if (o.app) return visPod(o);
  return visEnt(o);
}
function visKey(key) {
  const [type, id, i] = key.split(':');
  if (type === 'pod') return visPod(S.pods.get(id));
  if (type === 'node') return visNode(S.nodes.get(id));
  if (type === 'ent') return visEnt(S.ents.get(id));
  const a = S.apps.get(id);
  if (type === 'sat') return !!a && !!a.sats[+i] && visSat(a, a.sats[+i]);
  return visApp(a);
}

// Show or hide every SVG piece that belongs to one rendered object.
function showItem(it, on) {
  const d = on ? '' : 'none';
  for (const k of ['g', 'lbl', 'tether', 'halo']) if (it[k] && it[k].style.display !== d) it[k].style.display = d;
}

function renderFilter() {
  const box = $('#filter');
  const off = FILTERS.filter((f) => !F[f.id]).length;
  const pill = `<button class="f-pill" data-ftoggle aria-expanded="${FUI.open}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>
    <span>${off ? FILTERS.length - off + ' of ' + FILTERS.length + ' shown' : 'Showing all'}</span></button>`;
  const list = FUI.open ? `<div class="f-list">${FILTERS.map((f) => `<label class="f-row${F[f.id] ? '' : ' off'}" data-f="${f.id}">
    <svg viewBox="0 0 18 17.5"><use href="#k-${f.icon}"/></svg><span>${esc(f.label)}</span><i class="f-sw"></i></label>`).join('')}
    <div class="f-foot"><span data-fall>All on</span><span>V hides this</span></div></div>` : '';
  box.innerHTML = list + pill;
}

function wireFilter() {
  $('#filter').addEventListener('click', (ev) => {
    if (ev.target.closest('[data-ftoggle]')) FUI.open = !FUI.open;
    const row = ev.target.closest('[data-f]');
    if (row) { ev.preventDefault(); F[row.dataset.f] = !F[row.dataset.f]; V.auto = true; }
    if (ev.target.closest('[data-fall]')) { for (const f of FILTERS) F[f.id] = true; V.auto = true; }
    renderFilter();
  });
  $('#filter').addEventListener('pointerdown', (ev) => ev.stopPropagation());
  renderFilter();
}

// URL ?hide=pods,traffic starts with those groups off (used for screenshots).
function applyHideParam() {
  for (const id of (P.get('hide') || '').split(',')) if (id in F) F[id] = false;
  if (P.get('filter') === 'open') FUI.open = true;
}
// Main loop: simulate → render → effects → panel, every frame. No visible controls; hidden keys for the presenter:
// Space pause · → next beat · R restart · F fit · V show/hide the filter · Esc close panel.
const LOOP = { last: 0, health: 0, stopped: false };
const HEALTH = { errors: 0, frames: 0, last: '' };

function reportError(e) {
  HEALTH.errors += 1;
  HEALTH.last = String(e).slice(0, 200);
}
addEventListener('error', (ev) => reportError(ev.message));
addEventListener('unhandledrejection', (ev) => reportError(ev.reason));

function simulate(dt) {
  S.t += dt;
  stepScenario(dt);
  stepLife(dt);
  stepMetrics(dt);
  stepPhysics(dt);
}

function writeHealth() {
  $('#health').textContent = JSON.stringify({
    errors: HEALTH.errors, frames: HEALTH.frames, t: +S.t.toFixed(1), scn: +SCN.t.toFixed(1),
    pods: S.pods.size, nodes: liveNodes().length, k: +V.k.toFixed(3), sel: S.sel, last: HEALTH.last,
  });
}

function frame(now) {
  if (LOOP.stopped) return;
  const dt = LOOP.last ? Math.min(0.05, (now - LOOP.last) / 1000) : 1 / 60;
  LOOP.last = now;
  try {
    if (!S.paused) simulate(dt * S.speed);
    stepFx(S.paused ? 0 : dt * S.speed);
    stepView(dt, false);
    render();
    drawFx();
    stepPanel(dt);
    HEALTH.frames += 1;
    LOOP.health += dt;
    if (LOOP.health >= 0.5) { LOOP.health = 0; writeHealth(); }
  } catch (err) {
    reportError((err && err.stack) || err);
    if (HEALTH.errors > 30) LOOP.stopped = true;
  }
  requestAnimationFrame(frame);
}

// URL parameters reach any moment for screenshots: ?t=55 (fast-forward), ?select=app:cart, ?speed=2.
function warp(sec) {
  S.warp = true;
  const n = Math.round(clamp(sec, 0, SCN.period) * 30);
  for (let i = 0; i < n; i++) simulate(1 / 30);
  S.warp = false;
}

function wireKeys() {
  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); S.paused = !S.paused; }
    else if (k === 'arrowright') nextBeat();
    else if (k === 'r') restartScenario();
    else if (k === 'f') V.auto = true;
    else if (k === 'v') $('#filter').hidden = !$('#filter').hidden;
    else if (k === 'escape') select(null);
  });
}

function boot() {
  sizeCanvas();
  applyHideParam();
  resetWorld();
  initCaps();
  rankApps();
  settleLayout(400);
  buildStatic();
  wireView();
  wirePanel();
  wireFilter();
  wireKeys();
  const t = pNum('t', 0);
  if (t > 0) warp(t);
  rankApps();
  stepView(0, true);
  render();
  const sel = P.get('select');
  if (sel && selTarget(sel)) select(sel);
  stepView(0, true);
  writeHealth();
  requestAnimationFrame(frame);
}

try { boot(); } catch (err) { reportError((err && err.stack) || err); writeHealth(); }
</script>
</body>
</html>
