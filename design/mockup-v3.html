<style>
/* One white page: no bars, borders or filters. Only the click panel appears, as a shadowed sheet. */
.vk {
  --ink: #1e293b; --ink-2: #475569; --ink-3: #94a3b8; --k8s: #326ce5; --halo: #f5b83d;
  --line: #cbd5e1; --flow: #3b82f6; --drop: #dc2626; --ok: #16a34a; --warn: #d97706;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  position: fixed; inset: 0; background: #fff; color: var(--ink); font: 14px/1.4 var(--font); overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
.vk svg#svg, .vk canvas#fx { position: absolute; inset: 0; width: 100%; height: 100%; }
.vk canvas#fx { pointer-events: none; }
.vk svg#svg { cursor: grab; }
.vk svg#svg.drag { cursor: grabbing; }

/* labels keep a white halo so they stay readable over pods and lines */
.vk .lbl { font-family: var(--font); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.vk .lbl.name { font-size: 14px; font-weight: 600; fill: var(--ink); }
.vk .lbl.sub { font-size: 12px; fill: var(--ink-2); }
.vk .lbl.toast { font-size: 13px; fill: #0f172a; }
.vk .lbl.toast tspan.k { font-weight: 700; fill: var(--k8s); }
.vk .sys { opacity: 0.5; }
.vk .hit { cursor: pointer; }
.vk .hit:hover use.ic { filter: brightness(1.12); }
.vk .sel-ring { fill: none; stroke: var(--k8s); stroke-width: 2; stroke-dasharray: 4 3; }

.vk .edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
.vk .edge.deny { stroke: #fca5a5; stroke-dasharray: 5 4; }
.vk .tether { stroke: #dbe4f3; stroke-width: 1; }
.vk .cp-link { stroke: #e2e8f0; stroke-width: 1.2; stroke-dasharray: 2 4; fill: none; }
.vk .bar-bg { fill: #eef2f7; }
.vk .bar { fill: var(--k8s); }
.vk .bar.hot { fill: var(--warn); }

/* panel: the only surface, opened by a click, closed by Esc or a click on empty space */
.vk #panel {
  position: absolute; top: 16px; right: 16px; bottom: 16px; width: 440px; background: #fff;
  box-shadow: 0 12px 40px rgba(15, 23, 42, 0.16), 0 2px 6px rgba(15, 23, 42, 0.06); border-radius: 14px;
  transform: translateX(470px); transition: transform 0.25s ease; display: flex; flex-direction: column; overflow: hidden;
  user-select: text; -webkit-user-select: text;
}
.vk #panel.open { transform: none; }
.vk .p-head { display: flex; gap: 12px; align-items: center; padding: 18px 20px 10px; }
.vk .p-head svg { width: 40px; height: 40px; flex: 0 0 auto; }
.vk .p-title { font-size: 17px; font-weight: 650; }
.vk .p-kind { font-size: 13px; color: var(--ink-2); }
.vk .p-x { margin-left: auto; align-self: flex-start; background: none; border: 0; font-size: 20px; color: var(--ink-3); cursor: pointer; padding: 0 4px; }
.vk .p-body { overflow: auto; padding: 4px 20px 20px; }
.vk .p-sec { margin-top: 16px; }
.vk .p-sec h5 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.vk .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; font-size: 13px; }
.vk .kv span:nth-child(odd) { color: var(--ink-2); }
.vk .met { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.vk .met div { font-size: 12px; color: var(--ink-2); }
.vk .met b { display: block; font-size: 18px; color: var(--ink); font-weight: 600; }
.vk .met svg { width: 100%; height: 34px; display: block; margin-top: 4px; }
.vk pre { margin: 0; font: 12px/1.5 var(--mono); background: #f8fafc; border-radius: 8px; padding: 10px 12px; white-space: pre; overflow-x: auto; color: #334155; }
.vk pre.logs { max-height: 220px; overflow-y: auto; }
.vk pre .w { color: var(--warn); }
.vk pre .e { color: var(--drop); }
.vk pre .d { color: var(--ink-3); }
.vk .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.vk .chip { font-size: 12px; background: #f1f5f9; border-radius: 999px; padding: 2px 9px; color: var(--ink-2); cursor: pointer; }
.vk .note { font-size: 12px; color: var(--ink-3); margin-top: 18px; }

/* filter: one small pill bottom-left; opens a short list of switches above it */
.vk #filter { position: absolute; left: 16px; bottom: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.vk .f-pill { display: flex; align-items: center; gap: 6px; font: 12px var(--font); color: var(--ink-2); background: #fff;
  border: 0; border-radius: 999px; padding: 6px 12px 6px 10px; cursor: pointer; box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12); }
.vk .f-pill svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.vk .f-list { background: #fff; border-radius: 12px; padding: 6px; box-shadow: 0 8px 28px rgba(15, 23, 42, 0.14); min-width: 220px; }
.vk .f-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; font-size: 13px; cursor: pointer; }
.vk .f-row:hover { background: #f1f5f9; }
.vk .f-row svg { width: 20px; height: 20px; flex: 0 0 auto; }
.vk .f-row span { flex: 1; }
.vk .f-row.off { color: var(--ink-3); }
.vk .f-row.off svg { filter: grayscale(1); opacity: 0.45; }
.vk .f-sw { width: 26px; height: 15px; border-radius: 999px; background: var(--k8s); position: relative; flex: 0 0 auto; }
.vk .f-sw::after { content: ''; position: absolute; top: 2px; left: 13px; width: 11px; height: 11px; border-radius: 50%; background: #fff; transition: left 0.15s; }
.vk .f-row.off .f-sw { background: #cbd5e1; }
.vk .f-row.off .f-sw::after { left: 2px; }
.vk .f-foot { display: flex; justify-content: space-between; padding: 6px 8px 2px; font-size: 12px; color: var(--ink-3); }
.vk .f-foot [data-fall] { color: var(--k8s); cursor: pointer; }
.vk .thread { stroke-linecap: round; }
</style>
